openapi: 3.1.0
info:
  title: Scheduler Core API
  version: "1.0.0"
  description: |
    任务流转引擎的调度核心 HTTP 接口。
    业务层 (`/api/...`) 不在本规范范围内。

    **设计要点**
    - **一事一接口**: 创建一律 `POST /resource/create`,覆盖一律 `POST /resource/:id/save`,删除走 `DELETE`。
    - **强一致写入**: `/result` 是单次事务,任何一步失败全回滚。
    - **租约模型**: worker 通过 `lease` 拿到独占期 (`expected_by`),超时被 Reconciler 收回。
    - **路由可配置**: `step.routes` 用 JSON 描述,调度核心不解读业务语义。
servers:
  - url: http://localhost:4000
    description: 本地 dev
tags:
  - name: Metadata
  - name: Pipeline
  - name: Item
  - name: Queue
  - name: Lease
  - name: Result
  - name: Dedup
  - name: Dataset
  - name: Admin
  - name: Kanban

paths:
  # ───────────── Metadata ─────────────
  /health:
    get:
      tags: [Metadata]
      summary: 服务健康检查
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  ts: { type: integer }

  /api/v1/nodes:
    get:
      tags: [Metadata]
      summary: 节点能力清单
      description: 返回全部已注册节点的最新版本。
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/NodeDef" }

  # ───────────── Pipeline ─────────────
  /api/v1/pipelines:
    get:
      tags: [Pipeline]
      summary: 列出 pipeline
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  pipelines:
                    type: array
                    items:
                      type: object
                      properties:
                        task_id: { type: string, format: uuid }
                        name: { type: string }
                        step_count: { type: integer }
                        updated_at: { type: string, format: date-time }

  /api/v1/pipelines/create:
    post:
      tags: [Pipeline]
      summary: 创建 pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineWriteBody"
            example:
              name: 翻译流水线
              steps:
                - { key: ingest, nodeKey: ingest, params: { source: manual } }
                - { key: translate, nodeKey: translate, params: { model: claude-haiku } }
                - key: review
                  nodeKey: review
                  params: { rubric: default }
                  routes:
                    on: decision
                    cases:
                      approved: next
                      rejected: { goto: translate, maxLoops: 2 }
                - { key: export, nodeKey: export, params: { format: json } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        "400":
          description: 校验失败 (zod)

  /api/v1/pipelines/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Pipeline]
      summary: 查 pipeline 详情
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Pipeline]
      summary: 删除 pipeline (级联 items / outbox / dedup_keys / dataset_records)
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }

  /api/v1/pipelines/{id}/save:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Pipeline]
      summary: 覆盖 pipeline (替代 PUT)
      description: |
        Body 字段都是可选的,部分字段更新。**改 steps 时,所有 in-flight 的 (stepKey, nodeKey) 必须保留**,否则 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelinePartial"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: in-flight 冲突
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code: { type: string, example: INFLIGHT_STEPS_CONFLICT }
                      message: { type: string }
                      conflicts:
                        type: array
                        items:
                          type: object
                          properties:
                            itemId: { type: string }
                            stepKey: { type: string }
                            nodeKey: { type: string }

  # ───────────── Item ─────────────
  /api/v1/items/create:
    post:
      tags: [Item]
      summary: 投递一条 item (ingest)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId]
              properties:
                taskId: { type: string, format: uuid }
                envelope: { $ref: "#/components/schemas/Envelope" }
                startStep:
                  type: string
                  description: 默认从 steps[0].key 开始
            example:
              taskId: 11111111-1111-1111-1111-111111111111
              envelope:
                payload: { text: "Hello world" }
                tags: { source: manual }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  itemId: { type: string, format: uuid }
                  runId: { type: string, format: uuid }
        "400":
          description: EMPTY_PIPELINE 或 INVALID_START_STEP
        "404":
          description: PIPELINE_NOT_FOUND

  /api/v1/items/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Item]
      summary: 查 item 全貌 (item + inflight + history)
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/Item" }
                  inflight:
                    type: array
                    items: { $ref: "#/components/schemas/OutboxRow" }
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/Attempt" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/tasks/{taskId}/items:
    parameters:
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Item]
      summary: 列出某 pipeline 的 items
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }

  /api/v1/tasks/{taskId}/kanban:
    parameters:
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Kanban]
      summary: 看板聚合 (按 step 分组的 items)
      responses:
        "200":
          description: ok

  # ───────────── Queue ─────────────
  /api/v1/queue/{nodeKey}/lease:
    parameters:
      - { name: nodeKey, in: path, required: true, schema: { type: string } }
    post:
      tags: [Queue]
      summary: 按节点类型拉队列
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId]
              properties:
                workerId: { type: string }
                batchSize: { type: integer, minimum: 1, maximum: 50, default: 1 }
                leaseSeconds: { type: integer, minimum: 5, maximum: 3600, default: 60 }
      responses:
        "200":
          description: ok (jobs 可能为空)
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }

  /api/v1/queue/run/{runId}/claim:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Queue]
      summary: 精准认领指定 run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId]
              properties:
                workerId: { type: string }
                leaseSeconds: { type: integer, default: 60 }
      responses:
        "200":
          description: ok
        "409":
          description: ALREADY_CLAIMED

  /api/v1/queue/lease/{runId}/release:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Lease]
      summary: 主动放回租约 (回到 pending)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId]
              properties:
                workerId: { type: string }
      responses:
        "200":
          description: ok
        "409":
          description: LEASE_LOST

  /api/v1/queue/lease/{runId}/heartbeat:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Lease]
      summary: 续租 (推后 expected_by)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId, extendSeconds]
              properties:
                workerId: { type: string }
                extendSeconds: { type: integer, minimum: 5, maximum: 3600 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  newExpectedBy: { type: string, format: date-time }
        "409":
          description: LEASE_LOST

  /api/v1/result:
    post:
      tags: [Result]
      summary: 提交执行结果 (成功 / 失败)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runId, status]
              properties:
                runId: { type: string, format: uuid }
                status: { type: string, enum: [success, failed] }
                output: { type: object, additionalProperties: true }
                error:
                  type: object
                  required: [code, message]
                  properties:
                    code: { type: string }
                    message: { type: string }
                    retryable: { type: boolean, default: true }
                nextHint: { type: string, description: "强制跳转: stepKey / done / stuck" }
      responses:
        "200":
          description: ok 或 already-applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  applied: { type: boolean }
                  nextStep: { type: string }
                  retryAt: { type: string, format: date-time, nullable: true }
                  dlq: { type: boolean, nullable: true }
        "404":
          description: UNKNOWN_RUN
        "409":
          description: LEASE_EXPIRED

  # ───────────── Dedup ─────────────
  /api/v1/dedup/check:
    post:
      tags: [Dedup]
      summary: 字段级原子去重
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId, itemId, stepKey, hash]
              properties:
                taskId: { type: string, format: uuid }
                itemId: { type: string, format: uuid }
                stepKey: { type: string }
                hash: { type: string, minLength: 1 }
                fields: { type: object, additionalProperties: true }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  kept: { type: boolean }
                  hash: { type: string }
                  firstItemId: { type: string, nullable: true }

  # ───────────── Dataset ─────────────
  /api/v1/dataset/records/save:
    post:
      tags: [Dataset]
      summary: 写最终业务产物 (UPSERT BY item_id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId, itemId, payload]
              properties:
                taskId: { type: string, format: uuid }
                itemId: { type: string, format: uuid }
                payload: { type: object, additionalProperties: true }
                metadata: { type: object, additionalProperties: true }
      responses:
        "200":
          description: ok

  /api/v1/tasks/{taskId}/records:
    parameters:
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Dataset]
      summary: 列出某 pipeline 的入库记录
      responses:
        "200":
          description: ok

  # ───────────── Admin ─────────────
  /api/v1/admin/queue:
    get:
      tags: [Admin]
      summary: 队列计数 (按 nodeKey × status)
      responses:
        "200":
          description: ok

  /api/v1/admin/stuck:
    get:
      tags: [Admin]
      summary: 卡死 (DLQ) item 列表
      responses:
        "200":
          description: ok

  /api/v1/admin/items/{id}/replay:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Admin]
      summary: 重放 item 到指定 step
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stepKey]
              properties:
                stepKey: { type: string }
      responses:
        "200":
          description: ok

components:
  responses:
    NotFound:
      description: not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: NOT_FOUND }
  schemas:
    NodeDef:
      type: object
      properties:
        key: { type: string }
        version: { type: string }
        display_name: { type: string }
        manual: { type: boolean }
        idempotent: { type: boolean }
        default_timeout_ms: { type: integer }
        default_max_attempts: { type: integer }
        params_schema: { type: object, additionalProperties: true }

    StepConfig:
      type: object
      required: [key, nodeKey]
      properties:
        key: { type: string, description: pipeline 内唯一 }
        nodeKey: { type: string, description: 节点类型 (worker 拉队列就靠它) }
        nodeVersion: { type: string }
        label: { type: string }
        params: { type: object, additionalProperties: true }
        routes:
          type: object
          properties:
            on: { type: string, description: "从 output 中读哪个字段做匹配" }
            cases: { type: object, additionalProperties: true }
            default: {}
        policy:
          type: object
          properties:
            timeoutMs: { type: integer }
            maxAttempts: { type: integer }
            baseBackoffMs: { type: integer }

    PipelineWriteBody:
      type: object
      required: [name, steps]
      properties:
        name: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/StepConfig" }
        layout:
          type: object
          properties:
            positions:
              type: object
              additionalProperties:
                type: object
                properties:
                  x: { type: number }
                  y: { type: number }

    PipelinePartial:
      type: object
      properties:
        name: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/StepConfig" }
        layout:
          type: object

    Pipeline:
      type: object
      properties:
        task_id: { type: string, format: uuid }
        name: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/StepConfig" }
        layout: { type: object, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Envelope:
      type: object
      properties:
        payload: { type: object, additionalProperties: true }
        outputs:
          type: object
          additionalProperties: { type: object, additionalProperties: true }
          description: 每个 step 完成后写到 outputs[stepKey]
        tags:
          type: object
          additionalProperties: { type: string }

    Item:
      type: object
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        current_step: { type: string }
        envelope: { $ref: "#/components/schemas/Envelope" }
        loop_counts:
          type: object
          additionalProperties: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OutboxRow:
      type: object
      properties:
        run_id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        step_key: { type: string }
        node_key: { type: string }
        status: { type: string, enum: [pending, leased, done, failed] }
        attempt: { type: integer }
        leased_by: { type: string, nullable: true }
        leased_at: { type: string, format: date-time, nullable: true }
        expected_by: { type: string, format: date-time, nullable: true }

    Attempt:
      type: object
      properties:
        id: { type: integer }
        run_id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        step_key: { type: string }
        node_key: { type: string }
        attempt: { type: integer }
        outcome: { type: string, enum: [success, failed, timeout, dlq] }
        output: { type: object, additionalProperties: true, nullable: true }
        error: { type: object, additionalProperties: true, nullable: true }
        worker_id: { type: string, nullable: true }
        finished_at: { type: string, format: date-time }

    Job:
      type: object
      description: lease 的返回结构 — worker 干活就靠这个
      properties:
        runId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        stepKey: { type: string }
        nodeKey: { type: string }
        params: { type: object, additionalProperties: true }
        envelope: { $ref: "#/components/schemas/Envelope" }
        ctx:
          type: object
          properties:
            runId: { type: string, format: uuid }
            attempt: { type: integer }
            deadline: { type: string, format: date-time }
