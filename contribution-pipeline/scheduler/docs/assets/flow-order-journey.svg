<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1180" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1e40af"/>
    </marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1280" height="1180" fill="#fafaf9"/>

  <!-- 标题 -->
  <text x="640" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2937">
    一份订单的旅程：从下单到出餐
  </text>
  <text x="640" y="76" text-anchor="middle" font-size="15" fill="#6b7280">
    跟着这个🍔订单, 看它怎么走完整条流水线
  </text>

  <!-- ========== 步骤 1: 下单 ========== -->
  <g transform="translate(80, 120)">
    <circle cx="40" cy="40" r="32" fill="#1e40af"/>
    <text x="40" y="52" text-anchor="middle" font-size="32" fill="#fff" font-weight="700">1</text>

    <rect x="100" y="0" width="600" height="100" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
    <text x="120" y="32" font-size="18" font-weight="700" fill="#1e3a8a">📝 顾客点单</text>
    <text x="120" y="58" font-size="14" fill="#1e40af">"我要一个汉堡, 加生菜不要番茄"</text>
    <text x="120" y="80" font-size="13" fill="#3730a3" font-style="italic">→ 收银台收到, 写一张订单贴到"订单墙"上, 标注"第一站: 写菜单"</text>

    <g transform="translate(740, 14)">
      <rect width="160" height="72" rx="8" fill="#fff" stroke="#94a3b8"/>
      <text x="80" y="22" text-anchor="middle" font-size="11" fill="#64748b">🍔 订单卡片</text>
      <text x="80" y="42" text-anchor="middle" font-size="11" fill="#374151">汉堡, 生菜, 无番茄</text>
      <text x="80" y="60" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="600">下一站: 写菜单 ▶</text>
    </g>
  </g>

  <!-- 箭头 -->
  <line x1="420" y1="230" x2="420" y2="270" stroke="#1e40af" stroke-width="2" marker-end="url(#a1)"/>

  <!-- ========== 步骤 2: 写菜单 (人工) ========== -->
  <g transform="translate(80, 280)">
    <circle cx="40" cy="40" r="32" fill="#1e40af"/>
    <text x="40" y="52" text-anchor="middle" font-size="32" fill="#fff" font-weight="700">2</text>

    <rect x="100" y="0" width="800" height="100" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="120" y="32" font-size="18" font-weight="700" fill="#78350f">👨‍🍳 写菜单师傅"领单"</text>
    <text x="120" y="58" font-size="14" fill="#78350f">登录系统 → 看到看板上有待领取 → 点"我来" → 详细填写表单 → 点"提交"</text>
    <text x="120" y="80" font-size="13" fill="#92400e" font-style="italic">📌 关键: 同一份单, 一旦被某人领走, 30 秒内别人看不到 (lease 锁定)</text>
  </g>

  <line x1="420" y1="390" x2="420" y2="430" stroke="#1e40af" stroke-width="2" marker-end="url(#a1)"/>

  <!-- ========== 步骤 3: 自动查重 ========== -->
  <g transform="translate(80, 440)">
    <circle cx="40" cy="40" r="32" fill="#7c3aed"/>
    <text x="40" y="52" text-anchor="middle" font-size="32" fill="#fff" font-weight="700">3</text>

    <rect x="100" y="0" width="800" height="120" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="120" y="32" font-size="18" font-weight="700" fill="#5b21b6">🤖 查重机器人自动认领</text>
    <text x="120" y="58" font-size="14" fill="#5b21b6">每 2 秒扫一次订单墙, 看到自己负责的活就抢</text>
    <text x="120" y="82" font-size="13" fill="#6d28d9">把这份汉桌的"配方指纹"算出来, 翻一下小本子: 之前做过一模一样的吗?</text>
    <text x="120" y="104" font-size="13" fill="#9333ea" font-style="italic">→ 没做过 ✅ 继续    → 做过 ❌ 标记"重复", 走"放弃"路线</text>
  </g>

  <!-- 分支: 不重复继续 / 重复打回 -->
  <line x1="420" y1="570" x2="420" y2="610" stroke="#16a34a" stroke-width="2" marker-end="url(#a3)"/>
  <text x="430" y="595" font-size="12" fill="#16a34a" font-weight="600">没重复 ↓</text>

  <!-- ========== 步骤 4: 审核 (人工) ========== -->
  <g transform="translate(80, 620)">
    <circle cx="40" cy="40" r="32" fill="#1e40af"/>
    <text x="40" y="52" text-anchor="middle" font-size="32" fill="#fff" font-weight="700">4</text>

    <rect x="100" y="0" width="1100" height="200" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="120" y="32" font-size="18" font-weight="700" fill="#9a3412">👩‍🍳 质检师傅检查</text>
    <text x="120" y="58" font-size="14" fill="#9a3412">看着写好的菜单, 点"通过"或"打回"</text>

    <!-- 通过 -->
    <g transform="translate(120, 80)">
      <rect width="450" height="100" rx="10" fill="#dcfce7" stroke="#16a34a"/>
      <text x="225" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">✅ 通过</text>
      <text x="225" y="54" text-anchor="middle" font-size="13" fill="#166534">"这份单 OK, 进入下一站(装盒)"</text>
      <text x="225" y="78" text-anchor="middle" font-size="12" fill="#15803d" font-style="italic">→ 订单墙刷新, 出现新工位的待办</text>
    </g>

    <!-- 打回 -->
    <g transform="translate(600, 80)">
      <rect width="480" height="100" rx="10" fill="#fee2e2" stroke="#dc2626"/>
      <text x="240" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">❌ 打回 (带理由)</text>
      <text x="240" y="54" text-anchor="middle" font-size="13" fill="#991b1b">"番茄写错了, 让师傅再写一遍"</text>
      <text x="240" y="78" text-anchor="middle" font-size="12" fill="#b91c1c" font-style="italic">→ 订单回到第 2 步"写菜单", 但有最大重试次数</text>
    </g>
  </g>

  <!-- 分支箭头 -->
  <line x1="345" y1="820" x2="345" y2="870" stroke="#16a34a" stroke-width="2" marker-end="url(#a3)"/>
  <text x="355" y="855" font-size="12" fill="#16a34a" font-weight="600">通过 ↓</text>

  <!-- 打回回头箭头 -->
  <path d="M 840 820 Q 1230 820 1230 380 Q 1230 320 900 320" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#a2)" stroke-dasharray="6 4"/>
  <text x="1240" y="600" font-size="12" fill="#dc2626" font-weight="700" transform="rotate(90 1240 600)">↩ 打回重写 (loop back)</text>

  <!-- ========== 步骤 5: 装盒入库 ========== -->
  <g transform="translate(80, 880)">
    <circle cx="40" cy="40" r="32" fill="#7c3aed"/>
    <text x="40" y="52" text-anchor="middle" font-size="32" fill="#fff" font-weight="700">5</text>

    <rect x="100" y="0" width="800" height="100" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="120" y="32" font-size="18" font-weight="700" fill="#5b21b6">📦 入库机器人自动装盒</text>
    <text x="120" y="58" font-size="14" fill="#5b21b6">把通过的订单送到成品仓库 (dataset_records)</text>
    <text x="120" y="80" font-size="13" fill="#6d28d9" font-style="italic">→ 这条订单的"操作旅程"结束, 但成品永久保存</text>
  </g>

  <line x1="420" y1="990" x2="420" y2="1030" stroke="#1e40af" stroke-width="2" marker-end="url(#a1)"/>

  <!-- ========== 步骤 6: 完成 ========== -->
  <g transform="translate(80, 1040)">
    <circle cx="40" cy="40" r="32" fill="#16a34a"/>
    <text x="40" y="52" text-anchor="middle" font-size="32" fill="#fff" font-weight="700">✓</text>

    <rect x="100" y="0" width="800" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="120" y="32" font-size="18" font-weight="700" fill="#14532d">🎉 完成! 一份合格的"成品"诞生</text>
    <text x="120" y="58" font-size="14" fill="#166534">订单状态变成 done, 仓库里多了一条数据</text>
    <text x="120" y="82" font-size="13" fill="#15803d" font-style="italic">所有"中间过程"都记在历史本子里 (attempts), 谁做了什么一查便知</text>
  </g>

  <!-- 旁白: 异常情况 -->
  <g transform="translate(950, 880)">
    <rect width="280" height="220" rx="14" fill="#fce7f3" stroke="#db2777" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="140" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#831843">🔍 巡店质检员的工作</text>
    <text x="20" y="62" font-size="12" fill="#9d174d">如果某个厨师领了单</text>
    <text x="20" y="82" font-size="12" fill="#9d174d">但 30 秒还没出菜:</text>
    <text x="20" y="110" font-size="12" fill="#831843" font-weight="600">① 把单从他手里收回</text>
    <text x="20" y="132" font-size="12" fill="#831843" font-weight="600">② 重新挂回订单墙</text>
    <text x="20" y="154" font-size="12" fill="#831843" font-weight="600">③ 换别人继续做</text>
    <text x="20" y="180" font-size="12" fill="#9d174d">实在做不出?</text>
    <text x="20" y="200" font-size="12" fill="#dc2626" font-weight="600">→ 进废单堆 (DLQ), 人工干预</text>
  </g>
</svg>
