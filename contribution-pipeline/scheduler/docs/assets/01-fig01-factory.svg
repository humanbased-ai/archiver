<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="440" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">整个系统就是一个工厂</text>
  <text x="440" y="58" text-anchor="middle" font-size="13" fill="#64748b">剧本 / 货物 / 任务板 / 工人 / 巡检员 / 成品仓</text>

  <!-- Top: script library + worker room -->
  <rect x="40" y="86" width="240" height="96" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <rect x="40" y="86" width="240" height="28" rx="12" fill="#d97706"/>
  <rect x="40" y="100" width="240" height="14" fill="#d97706"/>
  <text x="160" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="white">剧本库 Pipeline</text>
  <text x="160" y="138" text-anchor="middle" font-size="12" fill="#1f2937">剧本1 · 剧本2 · 剧本3 …</text>
  <text x="160" y="160" text-anchor="middle" font-size="11" fill="#92400e" font-style="italic">数据状态变了,谁上场</text>

  <rect x="600" y="86" width="240" height="96" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="600" y="86" width="240" height="28" rx="12" fill="#2563eb"/>
  <rect x="600" y="100" width="240" height="14" fill="#2563eb"/>
  <text x="720" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="white">工人休息室 Workers</text>
  <text x="720" y="138" text-anchor="middle" font-size="12" fill="#1f2937">翻译工 · 审核工 · 入库工 …</text>
  <text x="720" y="160" text-anchor="middle" font-size="11" fill="#1e3a8a" font-style="italic">轮询任务板:"我能干啥?"</text>

  <!-- Center: task board (outbox) -->
  <rect x="40" y="208" width="800" height="148" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <rect x="40" y="208" width="800" height="34" rx="14" fill="#dc2626"/>
  <rect x="40" y="226" width="800" height="16" fill="#dc2626"/>
  <text x="440" y="231" text-anchor="middle" font-size="16" font-weight="700" fill="white">★ 中央任务板 Outbox ★</text>

  <rect x="64" y="262" width="232" height="74" rx="6" fill="white" stroke="#dc2626" stroke-width="1"/>
  <text x="180" y="284" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">任务1: 货物A 需要"翻译"</text>
  <text x="180" y="306" text-anchor="middle" font-size="11" fill="#16a34a">[待领]</text>
  <text x="180" y="326" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">谁先来谁拿</text>

  <rect x="324" y="262" width="232" height="74" rx="6" fill="white" stroke="#dc2626" stroke-width="1"/>
  <text x="440" y="284" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">任务2: 货物B 需要"翻译"</text>
  <text x="440" y="306" text-anchor="middle" font-size="11" fill="#d97706">[王已领, 倒计时 60s]</text>
  <text x="440" y="326" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">钉子=lease</text>

  <rect x="584" y="262" width="232" height="74" rx="6" fill="white" stroke="#dc2626" stroke-width="1"/>
  <text x="700" y="284" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">任务3: 货物C 需要"采集"</text>
  <text x="700" y="306" text-anchor="middle" font-size="11" fill="#16a34a">[待领]</text>
  <text x="700" y="326" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">人也来这里取</text>

  <!-- Arrows top to board -->
  <line x1="160" y1="184" x2="160" y2="206" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <text x="170" y="200" font-size="10" fill="#475569">读剧本</text>
  <line x1="720" y1="184" x2="720" y2="206" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <text x="730" y="200" font-size="10" fill="#475569">看活</text>

  <!-- Bottom: items conveyor + reconciler -->
  <rect x="40" y="384" width="380" height="96" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="40" y="384" width="380" height="28" rx="12" fill="#4f46e5"/>
  <rect x="40" y="398" width="380" height="14" fill="#4f46e5"/>
  <text x="230" y="404" text-anchor="middle" font-size="14" font-weight="700" fill="white">传送带 Items</text>
  <text x="230" y="438" text-anchor="middle" font-size="12" fill="#1f2937">货物A → 翻译位 · 货物B → 翻译位 …</text>
  <text x="230" y="458" text-anchor="middle" font-size="11" fill="#3730a3" font-style="italic">每条数据当前状态</text>

  <rect x="460" y="384" width="380" height="96" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <rect x="460" y="384" width="380" height="28" rx="12" fill="#059669"/>
  <rect x="460" y="398" width="380" height="14" fill="#059669"/>
  <text x="650" y="404" text-anchor="middle" font-size="14" font-weight="700" fill="white">巡检员 Reconciler</text>
  <text x="650" y="438" text-anchor="middle" font-size="12" fill="#1f2937">每 30s 巡查 · 过期任务收回</text>
  <text x="650" y="458" text-anchor="middle" font-size="11" fill="#064e3b" font-style="italic">工人挂了不丢任务</text>

  <line x1="230" y1="356" x2="230" y2="382" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <text x="240" y="375" font-size="10" fill="#475569">推进</text>
  <line x1="650" y1="382" x2="650" y2="356" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <text x="660" y="378" font-size="10" fill="#475569">扫</text>

  <!-- Bottom: dataset records -->
  <rect x="40" y="510" width="800" height="64" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <rect x="40" y="510" width="800" height="22" rx="12" fill="#ca8a04"/>
  <rect x="40" y="521" width="800" height="11" fill="#ca8a04"/>
  <text x="440" y="525" text-anchor="middle" font-size="14" font-weight="700" fill="white">成品仓库 Dataset Records</text>
  <text x="440" y="558" text-anchor="middle" font-size="12" fill="#1f2937">完工货物入库 · 干净 · 长期保留 · 给下游消费</text>

  <line x1="230" y1="482" x2="230" y2="508" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <text x="240" y="500" font-size="10" fill="#475569">完工</text>
</svg>
