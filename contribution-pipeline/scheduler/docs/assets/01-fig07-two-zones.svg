<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="440" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">为什么分两个数据区</text>
  <text x="440" y="58" text-anchor="middle" font-size="13" fill="#64748b">操作层 = 车间地面(进进出出)· 成品层 = 仓库(只入不动)</text>

  <!-- Operational layer -->
  <rect x="80" y="92" width="720" height="140" rx="14" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2.5"/>
  <rect x="80" y="92" width="720" height="32" rx="14" fill="#4f46e5"/>
  <rect x="80" y="108" width="720" height="16" fill="#4f46e5"/>
  <text x="440" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="white">操作层(过程库) — 又快又脏</text>

  <rect x="108" y="142" width="156" height="74" rx="8" fill="white" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="186" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">items</text>
  <text x="186" y="184" text-anchor="middle" font-size="11" fill="#475569">每条数据当前状态</text>
  <text x="186" y="202" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">current_step / envelope</text>

  <rect x="280" y="142" width="156" height="74" rx="8" fill="white" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="358" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">outbox</text>
  <text x="358" y="184" text-anchor="middle" font-size="11" fill="#475569">任务板 + 在飞行</text>
  <text x="358" y="202" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">pending / leased / done</text>

  <rect x="452" y="142" width="156" height="74" rx="8" fill="white" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="530" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">attempts</text>
  <text x="530" y="184" text-anchor="middle" font-size="11" fill="#475569">每次执行历史</text>
  <text x="530" y="202" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">用于审计 / 调试</text>

  <rect x="624" y="142" width="156" height="74" rx="8" fill="white" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="702" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">submissions</text>
  <text x="702" y="184" text-anchor="middle" font-size="11" fill="#475569">人的签到表 [规划]</text>
  <text x="702" y="202" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">同一用户去重</text>

  <text x="440" y="252" text-anchor="middle" font-size="11" fill="#3730a3" font-style="italic">数据多 · 变化快 · 可定期清理</text>

  <!-- Arrow down -->
  <line x1="440" y1="260" x2="440" y2="294" stroke="#475569" stroke-width="2.5" marker-end="url(#a1)"/>
  <text x="450" y="282" font-size="12" fill="#475569">完工 → 搬运</text>

  <!-- Dataset layer -->
  <rect x="80" y="298" width="720" height="100" rx="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/>
  <rect x="80" y="298" width="720" height="32" rx="14" fill="#ca8a04"/>
  <rect x="80" y="314" width="720" height="16" fill="#ca8a04"/>
  <text x="440" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="white">成品层(成品库) — 干净的最终结果</text>

  <rect x="290" y="346" width="300" height="40" rx="8" fill="white" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="440" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">dataset_records</text>

  <text x="440" y="430" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">数据稳定 · 长期保留 · 给下游消费 · 只入不动</text>
</svg>
