<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#444"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="880" fill="url(#bg)"/>

  <!-- 标题 -->
  <text x="640" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#92400e">
    调度中心 = 一家"流水线餐厅"
  </text>
  <text x="640" y="78" text-anchor="middle" font-size="16" fill="#78350f">
    顾客下单 → 经理派工 → 厨师/机器人做菜 → 出餐打包 → 进仓库
  </text>

  <!-- ========================= 顾客 ========================= -->
  <g transform="translate(60, 120)">
    <rect width="180" height="120" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="90" y="32" text-anchor="middle" font-size="40">👨‍💻</text>
    <text x="90" y="68" text-anchor="middle" font-size="16" font-weight="600" fill="#1e3a8a">客户 / 标注员</text>
    <text x="90" y="92" text-anchor="middle" font-size="13" fill="#1e40af">浏览器里点单</text>
    <text x="90" y="110" text-anchor="middle" font-size="13" fill="#1e40af">(React 前端)</text>
  </g>

  <!-- ========================= 餐厅经理 ========================= -->
  <g transform="translate(310, 100)">
    <rect width="540" height="180" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="270" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3412">
      🏢 餐厅大堂经理（Fastify 后端）
    </text>

    <!-- 收银台 -->
    <g transform="translate(20, 55)">
      <rect width="155" height="105" rx="10" fill="#fed7aa" stroke="#ea580c"/>
      <text x="77" y="28" text-anchor="middle" font-size="22">🧾</text>
      <text x="77" y="56" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d12">收银台</text>
      <text x="77" y="76" text-anchor="middle" font-size="11" fill="#7c2d12">接客点单</text>
      <text x="77" y="93" text-anchor="middle" font-size="11" fill="#7c2d12">(API 入口)</text>
    </g>

    <!-- 订单墙 -->
    <g transform="translate(192, 55)">
      <rect width="155" height="105" rx="10" fill="#fde68a" stroke="#d97706"/>
      <text x="77" y="28" text-anchor="middle" font-size="22">📋</text>
      <text x="77" y="56" text-anchor="middle" font-size="14" font-weight="600" fill="#78350f">订单墙</text>
      <text x="77" y="76" text-anchor="middle" font-size="11" fill="#78350f">所有待处理的单</text>
      <text x="77" y="93" text-anchor="middle" font-size="11" fill="#78350f">(outbox 队列)</text>
    </g>

    <!-- 派工 -->
    <g transform="translate(364, 55)">
      <rect width="155" height="105" rx="10" fill="#fecaca" stroke="#dc2626"/>
      <text x="77" y="28" text-anchor="middle" font-size="22">🎯</text>
      <text x="77" y="56" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">派工台</text>
      <text x="77" y="76" text-anchor="middle" font-size="11" fill="#7f1d1d">把单分到正确工位</text>
      <text x="77" y="93" text-anchor="middle" font-size="11" fill="#7f1d1d">(路由 / 流转)</text>
    </g>
  </g>

  <!-- 巡店质检员 -->
  <g transform="translate(900, 100)">
    <rect width="320" height="180" rx="16" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>
    <text x="160" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#831843">
      🔍 巡店质检员（Reconciler）
    </text>
    <text x="160" y="68" text-anchor="middle" font-size="13" fill="#9d174d">每隔 30 秒巡视一遍订单墙</text>
    <text x="160" y="92" text-anchor="middle" font-size="13" fill="#9d174d">看哪个厨师拿单太久没出菜</text>
    <text x="160" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#831843">→ 收回订单, 安排重做</text>
    <text x="160" y="142" text-anchor="middle" font-size="13" font-weight="600" fill="#831843">→ 实在做不出来? 进废单堆 (DLQ)</text>
    <text x="160" y="166" text-anchor="middle" font-size="11" fill="#9d174d" font-style="italic">"防止厨师溜号或卡死"</text>
  </g>

  <!-- ========================= 厨房工位区 ========================= -->
  <g transform="translate(60, 320)">
    <rect width="1160" height="280" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="580" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#155e75">
      🍳 后厨——各种工位（节点 / Steps）
    </text>

    <!-- 工位 1: 写菜单(采集) - 人工 -->
    <g transform="translate(40, 60)">
      <rect width="200" height="190" rx="12" fill="#fff" stroke="#0891b2" stroke-width="2"/>
      <text x="100" y="40" text-anchor="middle" font-size="36">👨‍🍳</text>
      <text x="100" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#155e75">写菜单 (采集)</text>
      <text x="100" y="95" text-anchor="middle" font-size="12" fill="#0e7490">真人厨师上岗</text>
      <text x="100" y="115" text-anchor="middle" font-size="11" fill="#475569">─────────────</text>
      <text x="100" y="135" text-anchor="middle" font-size="12" fill="#334155">在前端填表单</text>
      <text x="100" y="153" text-anchor="middle" font-size="12" fill="#334155">写完点"提交"</text>
      <text x="100" y="178" text-anchor="middle" font-size="11" fill="#0891b2" font-style="italic">manual = true</text>
    </g>

    <!-- 工位 2: 自动去重 - 机器人 -->
    <g transform="translate(265, 60)">
      <rect width="200" height="190" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
      <text x="100" y="40" text-anchor="middle" font-size="36">🤖</text>
      <text x="100" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">查重机器人 (dedup)</text>
      <text x="100" y="95" text-anchor="middle" font-size="12" fill="#6d28d9">每 2 秒自动认领</text>
      <text x="100" y="115" text-anchor="middle" font-size="11" fill="#475569">─────────────</text>
      <text x="100" y="135" text-anchor="middle" font-size="12" fill="#334155">看这道菜以前做过没</text>
      <text x="100" y="153" text-anchor="middle" font-size="12" fill="#334155">重复了直接退回</text>
      <text x="100" y="178" text-anchor="middle" font-size="11" fill="#7c3aed" font-style="italic">AutoWorker</text>
    </g>

    <!-- 工位 3: 审核 - 人工 -->
    <g transform="translate(490, 60)">
      <rect width="200" height="190" rx="12" fill="#fff" stroke="#0891b2" stroke-width="2"/>
      <text x="100" y="40" text-anchor="middle" font-size="36">👩‍🍳</text>
      <text x="100" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#155e75">质检师傅 (review)</text>
      <text x="100" y="95" text-anchor="middle" font-size="12" fill="#0e7490">真人审核</text>
      <text x="100" y="115" text-anchor="middle" font-size="11" fill="#475569">─────────────</text>
      <text x="100" y="135" text-anchor="middle" font-size="12" fill="#334155">通过 → 下一工位</text>
      <text x="100" y="153" text-anchor="middle" font-size="12" fill="#dc2626">不通过 → 打回重做</text>
      <text x="100" y="178" text-anchor="middle" font-size="11" fill="#0891b2" font-style="italic">manual = true</text>
    </g>

    <!-- 工位 4: 装盒 - 机器人 -->
    <g transform="translate(715, 60)">
      <rect width="200" height="190" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
      <text x="100" y="40" text-anchor="middle" font-size="36">📦</text>
      <text x="100" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">入库机器人 (export)</text>
      <text x="100" y="95" text-anchor="middle" font-size="12" fill="#6d28d9">每 2 秒自动认领</text>
      <text x="100" y="115" text-anchor="middle" font-size="11" fill="#475569">─────────────</text>
      <text x="100" y="135" text-anchor="middle" font-size="12" fill="#334155">把成品装盒</text>
      <text x="100" y="153" text-anchor="middle" font-size="12" fill="#334155">送进仓库</text>
      <text x="100" y="178" text-anchor="middle" font-size="11" fill="#7c3aed" font-style="italic">AutoWorker</text>
    </g>

    <!-- 工位 ...: 还可以扩展 -->
    <g transform="translate(940, 60)">
      <rect width="180" height="190" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="90" y="50" text-anchor="middle" font-size="36">➕</text>
      <text x="90" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">可加更多工位</text>
      <text x="90" y="118" text-anchor="middle" font-size="12" fill="#64748b">翻译 / 打分 /</text>
      <text x="90" y="136" text-anchor="middle" font-size="12" fill="#64748b">脱敏 / OCR ...</text>
      <text x="90" y="170" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">流水线可视化拖拽</text>
    </g>
  </g>

  <!-- ========================= 仓库 ========================= -->
  <g transform="translate(440, 660)">
    <rect width="400" height="170" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="200" y="40" text-anchor="middle" font-size="22">🏪</text>
    <text x="200" y="72" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">
      成品仓库 (dataset_records)
    </text>
    <text x="200" y="100" text-anchor="middle" font-size="13" fill="#166534">每完成一道菜, 这里多一份成品</text>
    <text x="200" y="124" text-anchor="middle" font-size="13" fill="#166534">长期保存, 给业务方使用</text>
    <text x="200" y="152" text-anchor="middle" font-size="12" fill="#15803d" font-style="italic">"出餐口" → 训练数据 / 报表 / 下游消费</text>
  </g>

  <!-- ========================= 箭头 ========================= -->
  <!-- 顾客 → 经理 -->
  <line x1="240" y1="180" x2="305" y2="180" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="272" y="172" text-anchor="middle" font-size="11" fill="#1e40af">①点单</text>

  <!-- 经理 → 厨房 (派单) -->
  <path d="M 580 285 L 580 320" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="608" y="307" font-size="11" fill="#9a3412">②派工到工位</text>

  <!-- 厨房 → 经理 (回报结果) -->
  <path d="M 700 320 L 700 285" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 3"/>
  <text x="710" y="305" font-size="11" fill="#166534">③出菜回报</text>

  <!-- 厨房 → 仓库 -->
  <path d="M 815 510 Q 700 580 640 660" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="700" y="600" font-size="12" fill="#15803d" font-weight="600">④最终入库</text>

  <!-- 质检员 → 厨房 (虚线, 巡视) -->
  <path d="M 1060 285 Q 1060 380 980 380" stroke="#db2777" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <text x="1085" y="340" font-size="11" fill="#9d174d">巡视</text>

  <!-- 图例 -->
  <g transform="translate(60, 760)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#1f2937">图例</text>
    <rect x="0" y="14" width="14" height="14" fill="#fff" stroke="#0891b2" stroke-width="2"/>
    <text x="22" y="26" font-size="12" fill="#1f2937">人工工位 (真人来做)</text>
    <rect x="180" y="14" width="14" height="14" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <text x="202" y="26" font-size="12" fill="#1f2937">自动机器人 (后台进程)</text>
    <line x1="370" y1="21" x2="400" y2="21" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="408" y="26" font-size="12" fill="#1f2937">实线 = 实际数据流转</text>
    <line x1="600" y1="21" x2="630" y2="21" stroke="#db2777" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="638" y="26" font-size="12" fill="#1f2937">虚线 = 后台监督</text>
  </g>
</svg>
