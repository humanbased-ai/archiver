<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="440" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">全景一张图</text>
  <text x="440" y="58" text-anchor="middle" font-size="13" fill="#64748b">前台 / 后端 / 任务板与状态 / 工人车间 / 成品仓</text>

  <!-- User -->
  <circle cx="440" cy="98" r="20" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="440" y="103" text-anchor="middle" font-size="18">👤</text>
  <text x="490" y="103" font-size="12" fill="#475569">人 / 浏览器</text>

  <!-- Frontend -->
  <rect x="80" y="146" width="720" height="74" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="80" y="146" width="720" height="28" rx="14" fill="#2563eb"/>
  <rect x="80" y="160" width="720" height="14" fill="#2563eb"/>
  <text x="440" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="white">前台 网页</text>
  <text x="440" y="200" text-anchor="middle" font-size="12" fill="#1f2937">Pipeline 编辑器 · 运行/监控 · 采集列表 [规划中] · 审核列表 [规划中]</text>

  <!-- Backend -->
  <rect x="80" y="244" width="720" height="120" rx="14" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <rect x="80" y="244" width="720" height="28" rx="14" fill="#059669"/>
  <rect x="80" y="258" width="720" height="14" fill="#059669"/>
  <text x="440" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="white">后端 单进程 (Fastify + Postgres)</text>
  <rect x="108" y="290" width="200" height="60" rx="8" fill="white" stroke="#059669" stroke-width="1.2"/>
  <text x="208" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">业务规则区</text>
  <text x="208" y="328" text-anchor="middle" font-size="11" fill="#1f2937">[规划拆分]</text>
  <text x="208" y="343" text-anchor="middle" font-size="10" fill="#475569" font-style="italic">未来可独立服务</text>

  <rect x="332" y="290" width="220" height="60" rx="8" fill="white" stroke="#059669" stroke-width="1.2"/>
  <text x="442" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">调度核心区</text>
  <text x="442" y="324" text-anchor="middle" font-size="10" fill="#1f2937">Dispatcher · Receiver · Reconciler · Router</text>
  <text x="442" y="342" text-anchor="middle" font-size="10" fill="#475569" font-style="italic">4 组件协作</text>

  <rect x="576" y="290" width="200" height="60" rx="8" fill="white" stroke="#059669" stroke-width="1.2"/>
  <text x="676" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">巡检员 Reconciler</text>
  <text x="676" y="324" text-anchor="middle" font-size="10" fill="#1f2937">每 30s 跑一次</text>
  <text x="676" y="342" text-anchor="middle" font-size="10" fill="#475569" font-style="italic">advisory_lock 多副本只跑一份</text>

  <line x1="308" y1="320" x2="332" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="552" y1="320" x2="576" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- DB -->
  <rect x="80" y="392" width="720" height="86" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <rect x="80" y="392" width="720" height="28" rx="14" fill="#dc2626"/>
  <rect x="80" y="406" width="720" height="14" fill="#dc2626"/>
  <text x="440" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="white">任务板 + 状态 + 历史/签到 (Postgres)</text>
  <text x="200" y="448" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">items</text>
  <text x="200" y="466" text-anchor="middle" font-size="10" fill="#475569" font-style="italic">货物当前状态</text>
  <text x="360" y="448" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">outbox</text>
  <text x="360" y="466" text-anchor="middle" font-size="10" fill="#475569" font-style="italic">任务板 (lease)</text>
  <text x="520" y="448" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">attempts</text>
  <text x="520" y="466" text-anchor="middle" font-size="10" fill="#475569" font-style="italic">每次执行历史</text>
  <text x="680" y="448" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">submissions [规划]</text>
  <text x="680" y="466" text-anchor="middle" font-size="10" fill="#475569" font-style="italic">人的签到表</text>

  <!-- Workers -->
  <rect x="80" y="502" width="540" height="74" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <rect x="80" y="502" width="540" height="28" rx="14" fill="#d97706"/>
  <rect x="80" y="516" width="540" height="14" fill="#d97706"/>
  <text x="350" y="522" text-anchor="middle" font-size="14" font-weight="700" fill="white">工人车间 Workers</text>
  <text x="350" y="556" text-anchor="middle" font-size="12" fill="#1f2937">翻译 · 去重 · 入库 · 审核(人) · 采集(人) …</text>

  <!-- Dataset -->
  <rect x="640" y="502" width="160" height="74" rx="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <rect x="640" y="502" width="160" height="28" rx="14" fill="#ca8a04"/>
  <rect x="640" y="516" width="160" height="14" fill="#ca8a04"/>
  <text x="720" y="522" text-anchor="middle" font-size="13" font-weight="700" fill="white">成品仓库</text>
  <text x="720" y="552" text-anchor="middle" font-size="11" fill="#1f2937">Dataset Records</text>
  <text x="720" y="568" text-anchor="middle" font-size="10" fill="#854d0e" font-style="italic">只入不动</text>

  <!-- Arrows: user → frontend, frontend → backend -->
  <line x1="440" y1="118" x2="440" y2="144" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="440" y1="220" x2="440" y2="242" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>

  <!-- backend → DB (write) and DB → backend (read) shown as one bidirectional -->
  <line x1="420" y1="364" x2="420" y2="390" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="460" y1="390" x2="460" y2="364" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <text x="396" y="382" text-anchor="end" font-size="10" fill="#475569">写</text>
  <text x="484" y="382" font-size="10" fill="#475569">读</text>

  <!-- DB ↔ workers (lease/result) -->
  <line x1="320" y1="478" x2="320" y2="500" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <text x="328" y="494" font-size="10" fill="#475569">领活</text>
  <line x1="380" y1="500" x2="380" y2="478" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <text x="388" y="494" font-size="10" fill="#475569">交活</text>

  <!-- workers → dataset -->
  <line x1="620" y1="540" x2="640" y2="540" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>

  <!-- footer note -->
  <text x="440" y="606" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">单进程跑得动几十节点 · 业务规则区与调度核心边界清晰 · 未来可拆分</text>
</svg>
