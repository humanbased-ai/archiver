<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="440" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">一次完整交互</text>
  <text x="440" y="58" text-anchor="middle" font-size="13" fill="#64748b">广播 + 订阅,不是点对点 — 调度只贴任务板,节点例行轮询</text>

  <!-- Lifelines headers -->
  <rect x="80" y="86" width="180" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">采集节点 (人)</text>

  <rect x="350" y="86" width="180" height="40" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="440" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">调度中心</text>

  <rect x="620" y="86" width="180" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="710" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">去重节点 (机器)</text>

  <!-- Lifelines (dashed verticals) -->
  <line x1="170" y1="126" x2="170" y2="572" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="440" y1="126" x2="440" y2="572" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="710" y1="126" x2="710" y2="572" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Step 1: 采集 → 调度: 有活吗 -->
  <line x1="170" y1="160" x2="438" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <text x="304" y="154" text-anchor="middle" font-size="12" fill="#1f2937">"有活吗?" (POST /lease)</text>

  <!-- Scheduler activation: scan board -->
  <rect x="430" y="174" width="20" height="56" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="464" y="194" font-size="11" fill="#475569">扫任务板,有"待采集"</text>
  <text x="464" y="212" font-size="11" fill="#475569">钉走、设倒计时</text>

  <!-- Step 2: 调度 → 采集: 派活 -->
  <line x1="438" y1="248" x2="172" y2="248" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <text x="304" y="242" text-anchor="middle" font-size="12" fill="#1f2937">派活 { schema: {url, title, content} }</text>

  <!-- Collector working -->
  <rect x="160" y="262" width="20" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="190" y="285" font-size="11" fill="#475569">用户填表…</text>

  <!-- Step 3: 采集 → 调度: 交活 -->
  <line x1="172" y1="320" x2="438" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <text x="304" y="314" text-anchor="middle" font-size="12" fill="#1f2937">"交活了" (POST /result)</text>
  <text x="304" y="332" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">{ url, title, content }</text>

  <!-- Scheduler advancement -->
  <rect x="430" y="346" width="20" height="100" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="464" y="364" font-size="11" fill="#475569">① 合并产出到数据状态</text>
  <text x="464" y="382" font-size="11" fill="#475569">② 查 pipeline 剧本: 采集 → 去重</text>
  <text x="464" y="400" font-size="11" fill="#475569">③ 推进 current_step</text>
  <text x="464" y="418" font-size="11" fill="#475569">④ 任务板贴新任务: "去重货物A"</text>

  <!-- Divider note -->
  <line x1="80" y1="468" x2="800" y2="468" stroke="#dc2626" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="440" y="486" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">调度不主动通知任何人</text>

  <!-- Step 4: 去重 → 调度 (next poll) -->
  <line x1="710" y1="514" x2="442" y2="514" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <text x="576" y="508" text-anchor="middle" font-size="12" fill="#1f2937">"有活吗?" (例行轮询)</text>

  <!-- Step 5: 调度 → 去重: 派活 -->
  <line x1="442" y1="552" x2="708" y2="552" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <text x="576" y="546" text-anchor="middle" font-size="12" fill="#1f2937">派活 → 自然接力 (后续自动流向 审核 → 入库)</text>

  <text x="440" y="600" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">节点不互相认识 · 调度只贴任务板 · 节点例行轮询取活</text>
</svg>
