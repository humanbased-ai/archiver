  <rect x="476" y="182" width="348" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="488" y="202" font-size="11" fill="#64748b">待采集</text>
  <text x="540" y="202" font-size="12" fill="#1f2937">货物 A</text>
  <rect x="740" y="190" width="74" height="20" rx="4" fill="#2563eb"/>
