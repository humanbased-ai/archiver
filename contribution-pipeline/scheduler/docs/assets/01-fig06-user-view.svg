  <text x="540" y="322" font-size="12" fill="#1f2937">货物 D</text>
  <rect x="740" y="310" width="74" height="20" rx="4" fill="#2563eb"/>
  <text x="777" y="324" text-anchor="middle" font-size="11" font-weight="600" fill="white">开始采集</text>

  <!-- Footer panel -->
  <rect x="40" y="380" width="800" height="180" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="440" y="408" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">怎么做到"同一人不重复"?</text>

  <rect x="80" y="424" width="340" height="120" rx="8" fill="white" stroke="#94a3b8" stroke-width="1"/>
  <text x="100" y="446" font-size="12" font-weight="700" fill="#1f2937">① 签到表 submissions [规划中]</text>
  <text x="100" y="466" font-size="11" fill="#475569">每次有人做完一条,记一笔</text>
  <text x="100" y="484" font-size="11" font-family="monospace" fill="#1f2937">(item_id, step_key, user_id, …)</text>
  <text x="100" y="510" font-size="12" font-weight="700" fill="#1f2937">② 列表查询自动过滤</text>
  <text x="100" y="530" font-size="11" fill="#475569">当前用户做过的不出现</text>

  <rect x="460" y="424" width="340" height="120" rx="8" fill="white" stroke="#94a3b8" stroke-width="1"/>
  <text x="480" y="446" font-size="12" font-weight="700" fill="#1f2937">③ 唯一索引兜底</text>
  <text x="480" y="466" font-size="11" font-family="monospace" fill="#1f2937">UNIQUE (item_id, step_key, user_id)</text>
  <text x="480" y="484" font-size="11" fill="#475569">并发提交也绕不过</text>
  <text x="480" y="510" font-size="12" font-weight="700" fill="#dc2626">注意:MVP 调度核心阶段</text>
  <text x="480" y="530" font-size="11" fill="#7f1d1d">这条规则尚未落地</text>
