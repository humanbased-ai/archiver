<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="440" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">数据模型</text>
  <text x="440" y="58" text-anchor="middle" font-size="13" fill="#64748b">items 是中心 — outbox / attempts / submissions 都挂在它下面</text>

  <!-- Top: definitions + pipelines -->
  <rect x="120" y="92" width="220" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <rect x="120" y="92" width="220" height="26" rx="10" fill="#d97706"/>
  <rect x="120" y="105" width="220" height="13" fill="#d97706"/>
  <text x="230" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="white">node_definitions</text>
  <text x="230" y="138" text-anchor="middle" font-size="11" fill="#1f2937">节点能力注册</text>
  <text x="230" y="156" text-anchor="middle" font-size="10" fill="#92400e" font-style="italic">(node_key → schema)</text>

  <rect x="540" y="92" width="220" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <rect x="540" y="92" width="220" height="26" rx="10" fill="#d97706"/>
  <rect x="540" y="105" width="220" height="13" fill="#d97706"/>
  <text x="650" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="white">pipelines</text>
  <text x="650" y="138" text-anchor="middle" font-size="11" fill="#1f2937">流程图模板(剧本)</text>
  <text x="650" y="156" text-anchor="middle" font-size="10" fill="#92400e" font-style="italic">task_id, steps, layout</text>

  <!-- Center: items -->
  <rect x="290" y="222" width="300" height="100" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2.5"/>
  <rect x="290" y="222" width="300" height="28" rx="10" fill="#4f46e5"/>
  <rect x="290" y="236" width="300" height="14" fill="#4f46e5"/>
  <text x="440" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="white">items</text>
  <text x="440" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">一条数据当前状态</text>
  <text x="440" y="290" text-anchor="middle" font-size="11" font-family="monospace" fill="#1f2937">id, task_id, current_step</text>
  <text x="440" y="308" text-anchor="middle" font-size="11" font-family="monospace" fill="#1f2937">envelope, loop_counts</text>

  <!-- arrow pipelines → items -->
  <line x1="650" y1="172" x2="540" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="608" y="200" font-size="10" fill="#475569">task_id</text>

  <!-- Three children: outbox / attempts / submissions -->
  <rect x="60" y="362" width="220" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <rect x="60" y="362" width="220" height="26" rx="10" fill="#dc2626"/>
  <rect x="60" y="375" width="220" height="13" fill="#dc2626"/>
  <text x="170" y="381" text-anchor="middle" font-size="13" font-weight="700" fill="white">outbox</text>
  <text x="170" y="408" text-anchor="middle" font-size="11" font-weight="600" fill="#7f1d1d">任务板 + 在飞行</text>
  <text x="170" y="428" text-anchor="middle" font-size="10" font-family="monospace" fill="#1f2937">run_id, item_id, step_key</text>
  <text x="170" y="444" text-anchor="middle" font-size="10" font-family="monospace" fill="#1f2937">status, leased_by, expected_by</text>

  <rect x="330" y="362" width="220" height="100" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="330" y="362" width="220" height="26" rx="10" fill="#4f46e5"/>
  <rect x="330" y="375" width="220" height="13" fill="#4f46e5"/>
  <text x="440" y="381" text-anchor="middle" font-size="13" font-weight="700" fill="white">attempts</text>
  <text x="440" y="408" text-anchor="middle" font-size="11" font-weight="600" fill="#3730a3">每次执行历史</text>
  <text x="440" y="428" text-anchor="middle" font-size="10" font-family="monospace" fill="#1f2937">item_id, step_key, run_id</text>
  <text x="440" y="444" text-anchor="middle" font-size="10" font-family="monospace" fill="#1f2937">status, started_at, ended_at</text>

  <rect x="600" y="362" width="220" height="100" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="600" y="362" width="220" height="26" rx="10" fill="#4f46e5"/>
  <rect x="600" y="375" width="220" height="13" fill="#4f46e5"/>
  <text x="710" y="381" text-anchor="middle" font-size="13" font-weight="700" fill="white">submissions [规划]</text>
  <text x="710" y="408" text-anchor="middle" font-size="11" font-weight="600" fill="#3730a3">用户提交记录</text>
  <text x="710" y="428" text-anchor="middle" font-size="10" font-family="monospace" fill="#1f2937">item_id, step_key, user_id</text>
  <text x="710" y="444" text-anchor="middle" font-size="10" font-family="monospace" fill="#1f2937">run_id, status, payload</text>

  <!-- arrows items → children -->
  <line x1="370" y1="322" x2="200" y2="360" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="440" y1="322" x2="440" y2="360" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="510" y1="322" x2="680" y2="360" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="270" y="342" text-anchor="middle" font-size="10" fill="#475569">item_id</text>
  <text x="450" y="345" text-anchor="middle" font-size="10" fill="#475569">item_id</text>
  <text x="610" y="342" text-anchor="middle" font-size="10" fill="#475569">item_id</text>

  <!-- Dataset records (separate, not joined to items) -->
  <rect x="290" y="492" width="300" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/>
  <rect x="290" y="492" width="300" height="26" rx="10" fill="#ca8a04"/>
  <rect x="290" y="505" width="300" height="13" fill="#ca8a04"/>
  <text x="440" y="511" text-anchor="middle" font-size="13" font-weight="700" fill="white">dataset_records</text>
  <text x="440" y="538" text-anchor="middle" font-size="11" font-weight="600" fill="#854d0e">成品库,长期保留</text>
  <text x="440" y="554" text-anchor="middle" font-size="10" fill="#854d0e" font-style="italic">完工时由入库节点写入</text>
</svg>
