<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="440" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">任务板怎么防止打架</text>
  <text x="440" y="58" text-anchor="middle" font-size="13" fill="#64748b">一行 SQL: <tspan font-family="monospace" font-size="12" fill="#0f172a">FOR UPDATE SKIP LOCKED</tspan></text>

  <!-- Task board -->
  <rect x="120" y="92" width="640" height="120" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <rect x="120" y="92" width="640" height="32" rx="14" fill="#dc2626"/>
  <rect x="120" y="108" width="640" height="16" fill="#dc2626"/>
  <text x="440" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="white">中央任务板</text>

  <!-- Task A -->
  <rect x="160" y="138" width="240" height="58" rx="8" fill="white" stroke="#dc2626" stroke-width="1.5"/>
  <text x="280" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">任务 A: 翻译货物 A</text>
  <text x="280" y="182" text-anchor="middle" font-size="11" fill="#16a34a">[待领]</text>

  <!-- Task B -->
  <rect x="480" y="138" width="240" height="58" rx="8" fill="white" stroke="#dc2626" stroke-width="1.5"/>
  <text x="600" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">任务 B: 翻译货物 B</text>
  <text x="600" y="182" text-anchor="middle" font-size="11" fill="#16a34a">[待领]</text>

  <!-- Wang -->
  <rect x="80" y="262" width="200" height="120" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="80" y="262" width="200" height="32" rx="14" fill="#2563eb"/>
  <rect x="80" y="278" width="200" height="16" fill="#2563eb"/>
  <text x="180" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="white">翻译工 王</text>
  <text x="180" y="324" text-anchor="middle" font-size="13" fill="#1f2937">"我看上货物 A 了"</text>
  <text x="180" y="346" text-anchor="middle" font-size="11" fill="#1e3a8a" font-style="italic">先到</text>
  <text x="180" y="368" text-anchor="middle" font-size="11" fill="#16a34a">→ 钉走 A,拿到 lease</text>

  <!-- Li -->
  <rect x="600" y="262" width="200" height="120" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="600" y="262" width="200" height="32" rx="14" fill="#2563eb"/>
  <rect x="600" y="278" width="200" height="16" fill="#2563eb"/>
  <text x="700" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="white">翻译工 李</text>
  <text x="700" y="324" text-anchor="middle" font-size="13" fill="#1f2937">"我也看上货物 A"</text>
  <text x="700" y="346" text-anchor="middle" font-size="11" fill="#1e3a8a" font-style="italic">紧接着</text>
  <text x="700" y="368" text-anchor="middle" font-size="11" fill="#dc2626">→ A 已被钉,自动跳过 → 领 B</text>

  <!-- Wang -> A (success) -->
  <line x1="180" y1="260" x2="240" y2="200" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a1)"/>
  <text x="170" y="244" font-size="11" fill="#16a34a" font-weight="600">领 A ✓</text>

  <!-- Li -> A (blocked) -->
  <line x1="650" y1="260" x2="350" y2="200" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="350" y1="200" x2="346" y2="204" stroke="#dc2626" stroke-width="2"/>
  <line x1="350" y1="200" x2="354" y2="204" stroke="#dc2626" stroke-width="2"/>
  <text x="500" y="232" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="600">领 A ✗ skipped</text>

  <!-- Li -> B (success) -->
  <line x1="700" y1="260" x2="640" y2="200" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a1)"/>
  <text x="708" y="244" font-size="11" fill="#16a34a" font-weight="600">领 B ✓</text>

  <!-- Result panel -->
  <rect x="80" y="416" width="720" height="92" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="440" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">结果:王干 A,李干 B,各干各的,绝不重复</text>
  <text x="440" y="466" text-anchor="middle" font-size="12" fill="#475569">数据库行级锁 + SKIP LOCKED:加锁失败的事务跳过被锁行,不阻塞 / 不重复</text>
  <text x="440" y="488" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">不需要 Redis · 不需要 Kafka · 不需要 Zookeeper</text>
</svg>
