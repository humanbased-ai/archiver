<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="440" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">一条数据的旅程</text>
  <text x="440" y="58" text-anchor="middle" font-size="13" fill="#64748b">每经过一站,货物身上"长出新东西" — 后面的工位可以读前面的产出</text>

  <text x="40" y="108" font-size="12" font-weight="600" fill="#1f2937">入厂</text>
  <text x="838" y="108" text-anchor="end" font-size="12" font-weight="600" fill="#1f2937">出厂</text>

  <!-- Step boxes (alternating human/machine colors) -->
  <rect x="40" y="120" width="110" height="76" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="95" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">采集</text>
  <text x="95" y="170" text-anchor="middle" font-size="11" fill="#92400e">(人)</text>

  <rect x="178" y="120" width="110" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="233" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">翻译</text>
  <text x="233" y="170" text-anchor="middle" font-size="11" fill="#1e40af">(机)</text>

  <rect x="316" y="120" width="110" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="371" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">去重</text>
  <text x="371" y="170" text-anchor="middle" font-size="11" fill="#1e40af">(机)</text>

  <rect x="454" y="120" width="110" height="76" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="509" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">审核</text>
  <text x="509" y="170" text-anchor="middle" font-size="11" fill="#92400e">(人)</text>

  <rect x="592" y="120" width="110" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="647" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">入库</text>
  <text x="647" y="170" text-anchor="middle" font-size="11" fill="#1e40af">(机)</text>

  <rect x="730" y="120" width="110" height="76" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="785" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#854d0e">完成</text>
  <text x="785" y="170" text-anchor="middle" font-size="11" fill="#854d0e">成品仓</text>

  <!-- Arrows between steps -->
  <line x1="150" y1="158" x2="178" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="288" y1="158" x2="316" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="426" y1="158" x2="454" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="564" y1="158" x2="592" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="702" y1="158" x2="730" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>

  <!-- Envelope evolution -->
  <text x="440" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">envelope 累积:每站只追加,不覆盖</text>

  <rect x="60" y="258" width="760" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="80" y="278" font-size="12" font-weight="600" fill="#475569">入厂:</text>
  <text x="170" y="278" font-size="12" font-family="monospace" fill="#1f2937">{ 空 }</text>
  <text x="80" y="294" font-size="11" fill="#64748b" font-style="italic">刚入库,什么都没有</text>

  <rect x="60" y="312" width="760" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="80" y="332" font-size="12" font-weight="600" fill="#475569">采集后:</text>
  <text x="170" y="332" font-size="12" font-family="monospace" fill="#1f2937">{ collect: { 中文原文 } }</text>

  <rect x="60" y="366" width="760" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="80" y="386" font-size="12" font-weight="600" fill="#475569">翻译后:</text>
  <text x="170" y="386" font-size="12" font-family="monospace" fill="#1f2937">{ collect: …, translate: { 英文 } }</text>

  <rect x="60" y="420" width="760" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="80" y="440" font-size="12" font-weight="600" fill="#475569">去重后:</text>
  <text x="170" y="440" font-size="12" font-family="monospace" fill="#1f2937">{ …, dedup: { 重复=否 } }</text>

  <rect x="60" y="474" width="760" height="44" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="80" y="494" font-size="12" font-weight="600" fill="#854d0e">审核 + 入库后:</text>
  <text x="220" y="494" font-size="12" font-family="monospace" fill="#1f2937">{ …, review: { 通过 } }  →  最终产物入成品仓</text>
</svg>
