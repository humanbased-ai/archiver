<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="440" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">工人挂了怎么办</text>
  <text x="440" y="58" text-anchor="middle" font-size="13" fill="#64748b">任务有保鲜期,过期自动收回 — 任何环节挂了都不会丢任务</text>

  <!-- Timeline axis -->
  <line x1="80" y1="270" x2="800" y2="270" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="800,270 790,265 790,275" fill="#94a3b8"/>
  <text x="808" y="274" font-size="11" fill="#64748b">时间</text>

  <!-- T0 marker -->
  <circle cx="120" cy="270" r="6" fill="#2563eb"/>
  <line x1="120" y1="276" x2="120" y2="332" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="120" y="258" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">T = 0s</text>
  <rect x="60" y="338" width="160" height="68" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">王领走 翻译货物A</text>
  <text x="140" y="380" text-anchor="middle" font-size="11" fill="#1f2937">倒计时 worker 指定</text>
  <text x="140" y="397" text-anchor="middle" font-size="10" fill="#475569" font-style="italic">默认 60s · 5~3600s</text>

  <!-- T1 boom -->
  <circle cx="290" cy="270" r="6" fill="#dc2626"/>
  <line x1="290" y1="264" x2="290" y2="208" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="290" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">稍后</text>
  <rect x="220" y="138" width="140" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="290" y="162" text-anchor="middle" font-size="20">💥</text>
  <text x="290" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">王崩了</text>
  <text x="290" y="197" text-anchor="middle" font-size="10" fill="#7f1d1d" font-style="italic">再不会交活</text>

  <!-- T2 expiry -->
  <circle cx="450" cy="270" r="6" fill="#d97706"/>
  <line x1="450" y1="276" x2="450" y2="332" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="450" y="258" text-anchor="middle" font-size="11" font-weight="600" fill="#d97706">到点</text>
  <rect x="380" y="338" width="140" height="68" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="450" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">倒计时归零</text>
  <text x="450" y="380" text-anchor="middle" font-size="11" fill="#1f2937">任务变"过期"</text>
  <text x="450" y="397" text-anchor="middle" font-size="10" fill="#92400e" font-style="italic">状态在 DB · 无外部触发</text>

  <!-- T3 reconciler -->
  <circle cx="610" cy="270" r="6" fill="#059669"/>
  <line x1="610" y1="264" x2="610" y2="208" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="610" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">≤ 30s 后</text>
  <rect x="540" y="138" width="140" height="64" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="610" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">巡检员扫到</text>
  <text x="610" y="178" text-anchor="middle" font-size="10" fill="#1f2937">王领 → 待领</text>
  <text x="610" y="195" text-anchor="middle" font-size="10" fill="#065f46" font-style="italic">仅 idempotent 节点</text>

  <!-- T4 next worker -->
  <circle cx="770" cy="270" r="6" fill="#2563eb"/>
  <line x1="770" y1="276" x2="770" y2="332" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="770" y="258" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">下一刻</text>
  <rect x="700" y="338" width="140" height="68" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="770" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">李 例行轮询</text>
  <text x="770" y="380" text-anchor="middle" font-size="11" fill="#1f2937">领走 → 继续往下走</text>
  <text x="770" y="397" text-anchor="middle" font-size="10" fill="#475569" font-style="italic">货物A 不丢</text>

  <!-- Footer panel -->
  <rect x="60" y="442" width="780" height="68" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="450" y="468" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">不幂等节点 → 不自动重试,直接进 stuck 等人介入</text>
  <text x="450" y="492" text-anchor="middle" font-size="12" fill="#475569">扣款、发货、外部副作用类节点声明 idempotent=false,避免重复执行</text>
</svg>
