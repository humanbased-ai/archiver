services:
  postgres:
    image: postgres:16-alpine
    container_name: scheduler-pg
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      - "5433:5432"
    volumes:
      - scheduler_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  scheduler_pg_data:
