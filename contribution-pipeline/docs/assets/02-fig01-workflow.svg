<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="100%" style="max-width:880px;height:auto;background:transparent" font-family='-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif'>
  <defs>
    <marker id="arrW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <text x="440" y="24" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">Label Studio 标注工作流</text>

  <g font-size="12" font-weight="600">
    <rect x="48"  y="64" width="100" height="52" rx="10" fill="#E0F2FE" stroke="#BAE6FD"/>
    <text x="98"  y="86" text-anchor="middle" fill="#075985">创建项目</text>
    <text x="98"  y="104" text-anchor="middle" fill="#0EA5E9" font-size="10" font-weight="400">project</text>

    <rect x="162" y="64" width="100" height="52" rx="10" fill="#E0F2FE" stroke="#BAE6FD"/>
    <text x="212" y="86" text-anchor="middle" fill="#075985">配置界面</text>
    <text x="212" y="104" text-anchor="middle" fill="#0EA5E9" font-size="10" font-weight="400">XML config</text>

    <rect x="276" y="64" width="100" height="52" rx="10" fill="#E0F2FE" stroke="#BAE6FD"/>
    <text x="326" y="86" text-anchor="middle" fill="#075985">导入数据</text>
    <text x="326" y="104" text-anchor="middle" fill="#0EA5E9" font-size="10" font-weight="400">tasks</text>

    <rect x="390" y="64" width="100" height="52" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-dasharray="4 3"/>
    <text x="440" y="86" text-anchor="middle" fill="#3730A3">模型预标注</text>
    <text x="440" y="104" text-anchor="middle" fill="#6366F1" font-size="10" font-weight="400">可选 · ML Backend</text>

    <rect x="504" y="64" width="100" height="52" rx="10" fill="#FEF3C7" stroke="#FCD34D"/>
    <text x="554" y="86" text-anchor="middle" fill="#92400E">人工标注</text>
    <text x="554" y="104" text-anchor="middle" fill="#B45309" font-size="10" font-weight="400">/ 修正</text>

    <rect x="618" y="64" width="100" height="52" rx="10" fill="#FFE4E6" stroke="#FDA4AF"/>
    <text x="668" y="86" text-anchor="middle" fill="#9F1239">审核</text>
    <text x="668" y="104" text-anchor="middle" fill="#BE123C" font-size="10" font-weight="400">review</text>

    <rect x="732" y="64" width="100" height="52" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="782" y="86" text-anchor="middle" fill="#065F46">导出结果</text>
    <text x="782" y="104" text-anchor="middle" fill="#059669" font-size="10" font-weight="400">export</text>
  </g>

  <g stroke="#94A3B8" stroke-width="1.5" fill="none">
    <line x1="148" y1="90" x2="160" y2="90" marker-end="url(#arrW)"/>
    <line x1="262" y1="90" x2="274" y2="90" marker-end="url(#arrW)"/>
    <line x1="376" y1="90" x2="388" y2="90" marker-end="url(#arrW)"/>
    <line x1="490" y1="90" x2="502" y2="90" marker-end="url(#arrW)"/>
    <line x1="604" y1="90" x2="616" y2="90" marker-end="url(#arrW)"/>
    <line x1="718" y1="90" x2="730" y2="90" marker-end="url(#arrW)"/>
  </g>

  <text x="440" y="146" text-anchor="middle" fill="#94A3B8" font-size="11">原始数据 → 人工标注 / AI 预标注 → 审核 → 导出训练数据</text>
</svg>
