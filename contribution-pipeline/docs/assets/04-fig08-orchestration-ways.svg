<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" style="max-width:880px;height:auto;background:transparent" font-family='-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif'>
  <defs>
    <marker id="arr8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arr8d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#A78BFA"/>
    </marker>
  </defs>

  <text x="440" y="26" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">两种编排方式 · 同一份配置</text>

  <!-- UI: 可视化拖拽 -->
  <rect x="40" y="60" width="240" height="80" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="40" y="60" width="6" height="80" rx="3" fill="#0EA5E9"/>
  <text x="160" y="88" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">可视化拖拽画布</text>
  <text x="160" y="110" text-anchor="middle" fill="#64748B" font-size="11">运营 / 产品</text>
  <text x="160" y="128" text-anchor="middle" fill="#94A3B8" font-size="10.5">拖元能力节点 · 连线 · 配参数</text>

  <!-- CODE: 配置文件 -->
  <rect x="40" y="160" width="240" height="80" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="40" y="160" width="6" height="80" rx="3" fill="#10B981"/>
  <text x="160" y="188" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">修改配置文件</text>
  <text x="160" y="210" text-anchor="middle" fill="#64748B" font-size="11">研发 / 算法</text>
  <text x="160" y="228" text-anchor="middle" fill="#94A3B8" font-size="10.5">改 YAML / JSON · PR · 版本管理</text>

  <!-- CFG: 同一份配置 -->
  <rect x="360" y="110" width="180" height="80" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="450" y="140" text-anchor="middle" fill="#3730A3" font-size="14" font-weight="600">同一份配置</text>
  <text x="450" y="160" text-anchor="middle" fill="#6366F1" font-size="11">YAML / JSON</text>
  <text x="450" y="178" text-anchor="middle" fill="#94A3B8" font-size="10">单一事实来源</text>

  <!-- RUN: Pipeline Runner -->
  <rect x="620" y="110" width="220" height="80" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="730" y="140" text-anchor="middle" fill="#065F46" font-size="14" font-weight="600">Pipeline Runner</text>
  <text x="730" y="160" text-anchor="middle" fill="#10B981" font-size="11">实际执行</text>
  <text x="730" y="178" text-anchor="middle" fill="#94A3B8" font-size="10">按节点顺序调度任务</text>

  <!-- arrows -->
  <g stroke="#94A3B8" stroke-width="1.5" fill="none">
    <path d="M 280 100 L 360 138" marker-end="url(#arr8)"/>
    <path d="M 280 200 L 360 162" marker-end="url(#arr8)"/>
    <line x1="540" y1="150" x2="618" y2="150" marker-end="url(#arr8)"/>
  </g>

  <!-- arrow labels -->
  <text x="296" y="118" fill="#0EA5E9" font-size="10.5" font-weight="600">保存</text>
  <text x="296" y="190" fill="#10B981" font-size="10.5" font-weight="600">提交</text>
  <text x="566" y="142" fill="#6366F1" font-size="10.5" font-weight="600">执行</text>

  <!-- dashed loop back: CFG -> UI (load back) -->
  <path d="M 400 110 C 400 50, 220 30, 160 60" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arr8d)"/>
  <text x="280" y="44" text-anchor="middle" fill="#7C3AED" font-size="10.5">加载回画布 · 互通互转</text>
</svg>
