<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" style="max-width:880px;height:auto;background:transparent" font-family='-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif'>
  <defs>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <text x="440" y="24" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">单项目内 · 多角色协作（同一条数据多次流转）</text>

  <g font-size="12" font-weight="600">
    <rect x="20" y="110" width="86" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="63" y="137" text-anchor="middle" fill="#0f172a">原始数据</text>

    <rect x="118" y="110" width="86" height="44" rx="10" fill="#E0F2FE" stroke="#BAE6FD"/>
    <text x="161" y="137" text-anchor="middle" fill="#075985">导入 Task</text>

    <rect x="216" y="110" width="100" height="44" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="266" y="131" text-anchor="middle" fill="#065F46">ML 预标</text>
    <text x="266" y="146" text-anchor="middle" fill="#10B981" font-size="10" font-weight="400">Prediction</text>

    <rect x="328" y="110" width="120" height="44" rx="10" fill="#FEF3C7" stroke="#FCD34D"/>
    <text x="388" y="131" text-anchor="middle" fill="#92400E">人工标注</text>
    <text x="388" y="146" text-anchor="middle" fill="#B45309" font-size="10" font-weight="400">Annotation</text>

    <!-- diamond -->
    <polygon points="510,110 562,132 510,154 458,132" fill="#FFE4E6" stroke="#FDA4AF"/>
    <text x="510" y="137" text-anchor="middle" fill="#9F1239">审核</text>

    <rect x="600" y="68" width="140" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="670" y="89" text-anchor="middle" fill="#0f172a">ML 打分 / 校验</text>
    <text x="670" y="104" text-anchor="middle" fill="#64748B" font-size="10" font-weight="400">model review</text>

    <rect x="600" y="152" width="140" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="670" y="173" text-anchor="middle" fill="#0f172a">Reviewer 复核</text>
    <text x="670" y="188" text-anchor="middle" fill="#64748B" font-size="10" font-weight="400">human review</text>

    <rect x="772" y="110" width="86" height="44" rx="10" fill="#E0E7FF" stroke="#C7D2FE"/>
    <text x="815" y="137" text-anchor="middle" fill="#3730A3">导出</text>
  </g>

  <g stroke="#94A3B8" stroke-width="1.5" fill="none">
    <line x1="106" y1="132" x2="116" y2="132" marker-end="url(#arrS)"/>
    <line x1="204" y1="132" x2="214" y2="132" marker-end="url(#arrS)"/>
    <line x1="316" y1="132" x2="326" y2="132" marker-end="url(#arrS)"/>
    <line x1="448" y1="132" x2="456" y2="132" marker-end="url(#arrS)"/>

    <path d="M 540 122 L 580 90 L 598 90" marker-end="url(#arrS)"/>
    <path d="M 540 142 L 580 174 L 598 174" marker-end="url(#arrS)"/>

    <path d="M 740 90 L 770 122" marker-end="url(#arrS)"/>
    <path d="M 740 174 L 770 142" marker-end="url(#arrS)"/>
  </g>

  <text x="556" y="80" fill="#65A30D" font-size="10.5" font-weight="600">模型路</text>
  <text x="556" y="216" fill="#0EA5E9" font-size="10.5" font-weight="600">人工路</text>

  <text x="440" y="240" text-anchor="middle" fill="#94A3B8" font-size="11">同一 Task 上挂多个 Annotation / Prediction · 多角色围绕同一条数据协作</text>
</svg>
