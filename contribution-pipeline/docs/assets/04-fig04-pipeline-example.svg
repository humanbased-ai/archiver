<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" style="max-width:880px;height:auto;background:transparent" font-family='-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif'>
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <text x="440" y="24" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">编排示意 · 一条标准流水线</text>

  <!-- nodes -->
  <g>
    <rect x="20"  y="110" width="80"  height="40" rx="10" fill="#E0F2FE" stroke="#BAE6FD"/>
    <text x="60"  y="135" text-anchor="middle" fill="#075985" font-size="12" font-weight="600">采集</text>

    <rect x="120" y="110" width="80"  height="40" rx="10" fill="#E0F2FE" stroke="#BAE6FD"/>
    <text x="160" y="135" text-anchor="middle" fill="#075985" font-size="12" font-weight="600">清洗</text>

    <rect x="220" y="110" width="90"  height="40" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="265" y="135" text-anchor="middle" fill="#3730A3" font-size="12" font-weight="600">AI 预标</text>

    <!-- diamond: 分流 -->
    <polygon points="380,108 432,130 380,152 328,130" fill="#FEF3C7" stroke="#FCD34D"/>
    <text x="380" y="128" text-anchor="middle" fill="#92400E" font-size="11" font-weight="600">分流</text>
    <text x="380" y="142" text-anchor="middle" fill="#A16207" font-size="9.5">有把握?</text>

    <rect x="470" y="68"  width="110" height="40" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="525" y="93" text-anchor="middle" fill="#065F46" font-size="12" font-weight="600">自动审核</text>

    <rect x="470" y="170" width="110" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="525" y="195" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">人工标注</text>

    <rect x="610" y="170" width="110" height="40" rx="10" fill="#FFE4E6" stroke="#FDA4AF"/>
    <text x="665" y="195" text-anchor="middle" fill="#9F1239" font-size="12" font-weight="600">人工审核</text>

    <rect x="760" y="110" width="100" height="40" rx="10" fill="#E0E7FF" stroke="#C7D2FE"/>
    <text x="810" y="135" text-anchor="middle" fill="#3730A3" font-size="12" font-weight="600">导出</text>
  </g>

  <!-- main arrows -->
  <g stroke="#94A3B8" stroke-width="1.5" fill="none">
    <line x1="100" y1="130" x2="118" y2="130" marker-end="url(#arr4)"/>
    <line x1="200" y1="130" x2="218" y2="130" marker-end="url(#arr4)"/>
    <line x1="310" y1="130" x2="326" y2="130" marker-end="url(#arr4)"/>

    <!-- diamond -> 自动审核 (top yes branch) -->
    <path d="M 380 108 L 380 88 L 468 88" marker-end="url(#arr4)"/>
    <!-- 自动审核 -> 导出 -->
    <path d="M 580 88 L 720 88 L 720 130 L 758 130" marker-end="url(#arr4)"/>

    <!-- diamond -> 人工标注 (bottom no branch) -->
    <path d="M 380 152 L 380 190 L 468 190" marker-end="url(#arr4)"/>
    <!-- 人工标注 -> 人工审核 -->
    <line x1="580" y1="190" x2="608" y2="190" marker-end="url(#arr4)"/>
    <!-- 人工审核 -> 导出 (合格) -->
    <path d="M 720 190 L 740 190 L 740 130 L 758 130" marker-end="url(#arr4)"/>
  </g>

  <!-- loop: 人工审核 -> 人工标注 (不合格) -->
  <path d="M 665 210 L 665 240 L 525 240 L 525 212" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arr4)"/>

  <!-- branch labels -->
  <text x="395" y="80" fill="#65A30D" font-size="10.5" font-weight="600">是</text>
  <text x="395" y="178" fill="#DC2626" font-size="10.5" font-weight="600">否</text>
  <text x="745" y="158" fill="#65A30D" font-size="10.5">合格</text>
  <text x="585" y="252" fill="#DC2626" font-size="10.5">不合格 · 打回重标</text>
</svg>
