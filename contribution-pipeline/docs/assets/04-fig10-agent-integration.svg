<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" style="max-width:880px;height:auto;background:transparent" font-family='-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif'>
  <defs>
    <marker id="arrAg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrAg2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6366F1"/>
    </marker>
  </defs>

  <text x="440" y="24" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">AI Agent 接入 · Agent = 一种 ML Backend</text>
  <text x="440" y="42" text-anchor="middle" fill="#64748B" font-size="11">同协议 · 可插入 pipeline 多个节点 · 数据按统一契约流转</text>

  <!-- ============== Pipeline node row ============== -->
  <text x="20" y="72" fill="#475569" font-size="11" font-weight="600">① Pipeline 节点 · ★ 标记的节点可由 Agent 实现</text>

  <g font-size="11.5">
    <!-- 采集 (gray) -->
    <rect x="30"  y="84" width="92" height="46" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="76"  y="105" text-anchor="middle" fill="#475569" font-weight="600">采集</text>
    <text x="76"  y="120" text-anchor="middle" fill="#94A3B8" font-size="10">collect</text>

    <!-- 清洗 (gray) -->
    <rect x="134" y="84" width="92" height="46" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="180" y="105" text-anchor="middle" fill="#475569" font-weight="600">清洗</text>
    <text x="180" y="120" text-anchor="middle" fill="#94A3B8" font-size="10">clean</text>

    <!-- 转换 ★ -->
    <rect x="238" y="84" width="92" height="46" rx="9" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="284" y="105" text-anchor="middle" fill="#3730A3" font-weight="700">转换 ★</text>
    <text x="284" y="120" text-anchor="middle" fill="#6366F1" font-size="10">transform</text>

    <!-- 模型 ★ -->
    <rect x="342" y="84" width="92" height="46" rx="9" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="388" y="105" text-anchor="middle" fill="#3730A3" font-weight="700">模型 ★</text>
    <text x="388" y="120" text-anchor="middle" fill="#6366F1" font-size="10">model</text>

    <!-- 分流 ★ -->
    <rect x="446" y="84" width="92" height="46" rx="9" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="492" y="105" text-anchor="middle" fill="#3730A3" font-weight="700">分流 ★</text>
    <text x="492" y="120" text-anchor="middle" fill="#6366F1" font-size="10">route</text>

    <!-- 标注 (gray, human) -->
    <rect x="550" y="84" width="92" height="46" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="596" y="105" text-anchor="middle" fill="#475569" font-weight="600">标注</text>
    <text x="596" y="120" text-anchor="middle" fill="#94A3B8" font-size="10">annotate</text>

    <!-- 审核 ★ -->
    <rect x="654" y="84" width="92" height="46" rx="9" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="700" y="105" text-anchor="middle" fill="#3730A3" font-weight="700">审核 ★</text>
    <text x="700" y="120" text-anchor="middle" fill="#6366F1" font-size="10">review</text>

    <!-- 导出 -->
    <rect x="758" y="84" width="92" height="46" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="804" y="105" text-anchor="middle" fill="#475569" font-weight="600">导出</text>
    <text x="804" y="120" text-anchor="middle" fill="#94A3B8" font-size="10">export</text>
  </g>

  <!-- arrows between pipeline nodes -->
  <g stroke="#CBD5E1" stroke-width="1.2" fill="none">
    <line x1="122" y1="107" x2="132" y2="107"/>
    <line x1="226" y1="107" x2="236" y2="107"/>
    <line x1="330" y1="107" x2="340" y2="107"/>
    <line x1="434" y1="107" x2="444" y2="107"/>
    <line x1="538" y1="107" x2="548" y2="107"/>
    <line x1="642" y1="107" x2="652" y2="107"/>
    <line x1="746" y1="107" x2="756" y2="107"/>
  </g>

  <!-- drop arrows from ★ nodes to ML Backend lane -->
  <g stroke="#6366F1" stroke-width="1.5" stroke-dasharray="3 3" fill="none">
    <line x1="284" y1="130" x2="284" y2="180" marker-end="url(#arrAg2)"/>
    <line x1="388" y1="130" x2="388" y2="180" marker-end="url(#arrAg2)"/>
    <line x1="492" y1="130" x2="492" y2="180" marker-end="url(#arrAg2)"/>
    <line x1="700" y1="130" x2="700" y2="180" marker-end="url(#arrAg2)"/>
  </g>

  <!-- ============== ML Backend lane (Agent + simple) ============== -->
  <rect x="30" y="184" width="820" height="100" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="50" y="208" fill="#065F46" font-size="12" font-weight="700">② ML Backend 服务 · 同协议 · 同接入方式</text>
  <text x="50" y="226" fill="#10B981" font-size="11">无论是单步模型还是多步 Agent · pipeline 都按相同的 /predict 调用</text>

  <!-- Two backend types side by side -->
  <rect x="60" y="238" width="370" height="36" rx="9" fill="#FFFFFF" stroke="#A7F3D0"/>
  <text x="80" y="261" fill="#065F46" font-size="12" font-weight="600">简单模型</text>
  <text x="80" y="276" fill="#10B981" font-size="9.5"></text>
  <text x="156" y="261" fill="#64748B" font-size="11">输入 → 单次推理 → 输出（YOLO / Whisper / LLM 分类）</text>

  <rect x="450" y="238" width="380" height="36" rx="9" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="470" y="261" fill="#065F46" font-size="12" font-weight="700">Agent</text>
  <text x="510" y="261" fill="#64748B" font-size="11">输入 → Plan / Act-Tool / Observe / Reflect 多步 → 输出</text>

  <!-- ============== Data contract ============== -->
  <text x="20" y="312" fill="#475569" font-size="11" font-weight="600">③ 数据契约 · 任意节点的 ML Backend 都按这个收发</text>

  <!-- Input envelope -->
  <rect x="30" y="324" width="400" height="200" rx="12" fill="#0F172A"/>
  <rect x="30" y="324" width="400" height="24" rx="12" fill="#1E293B"/>
  <text x="44" y="341" fill="#A7F3D0" font-size="10.5" font-weight="600">→ 输入：Task Envelope</text>
  <text x="420" y="341" text-anchor="end" fill="#94A3B8" font-size="9.5">POST /predict</text>

  <g font-family="ui-monospace,Menlo,SFMono-Regular,monospace" font-size="10.5">
    <text x="44" y="364" fill="#7DD3FC">{</text>
    <text x="56" y="380" fill="#A7F3D0">"task_id"</text>
    <text x="116" y="380" fill="#94A3B8">: </text>
    <text x="128" y="380" fill="#FCA5A5">"task_001"</text>
    <text x="188" y="380" fill="#94A3B8">,</text>
    <text x="56" y="396" fill="#A7F3D0">"node"</text>
    <text x="98" y="396" fill="#94A3B8">: </text>
    <text x="110" y="396" fill="#FCA5A5">"review"</text>
    <text x="160" y="396" fill="#94A3B8">,            // 元能力名</text>
    <text x="56" y="412" fill="#A7F3D0">"data"</text>
    <text x="94" y="412" fill="#94A3B8">: { </text>
    <text x="118" y="412" fill="#FCA5A5">"image"</text>
    <text x="160" y="412" fill="#94A3B8">: </text>
    <text x="172" y="412" fill="#FCA5A5">"s3://..."</text>
    <text x="232" y="412" fill="#94A3B8"> },</text>
    <text x="56" y="428" fill="#A7F3D0">"predictions"</text>
    <text x="138" y="428" fill="#94A3B8">: [...],</text>
    <text x="200" y="428" fill="#94A3B8">  // 上游已产出</text>
    <text x="56" y="444" fill="#A7F3D0">"annotations"</text>
    <text x="138" y="444" fill="#94A3B8">: [...],</text>
    <text x="200" y="444" fill="#94A3B8">  // 人工已产出</text>
    <text x="56" y="460" fill="#A7F3D0">"context"</text>
    <text x="114" y="460" fill="#94A3B8">: { </text>
    <text x="138" y="460" fill="#FCA5A5">"config"</text>
    <text x="184" y="460" fill="#94A3B8">: {...},</text>
    <text x="56" y="476" fill="#94A3B8">             </text>
    <text x="118" y="476" fill="#FCA5A5">"budget"</text>
    <text x="164" y="476" fill="#94A3B8">: { </text>
    <text x="188" y="476" fill="#FCA5A5">"steps"</text>
    <text x="226" y="476" fill="#94A3B8">: </text>
    <text x="238" y="476" fill="#FCD34D">8</text>
    <text x="246" y="476" fill="#94A3B8">, </text>
    <text x="258" y="476" fill="#FCA5A5">"timeout"</text>
    <text x="306" y="476" fill="#94A3B8">: </text>
    <text x="318" y="476" fill="#FCD34D">30</text>
    <text x="332" y="476" fill="#94A3B8"> } }</text>
    <text x="44" y="492" fill="#7DD3FC">}</text>
  </g>
  <text x="44" y="512" fill="#94A3B8" font-size="10">同一份契约 · 简单模型只用 data · Agent 还会用 budget / context</text>

  <!-- Output envelope -->
  <rect x="450" y="324" width="400" height="200" rx="12" fill="#0F172A"/>
  <rect x="450" y="324" width="400" height="24" rx="12" fill="#1E293B"/>
  <text x="464" y="341" fill="#FCD34D" font-size="10.5" font-weight="600">← 输出：Result Envelope</text>
  <text x="840" y="341" text-anchor="end" fill="#94A3B8" font-size="9.5">200 OK</text>

  <g font-family="ui-monospace,Menlo,SFMono-Regular,monospace" font-size="10.5">
    <text x="464" y="364" fill="#7DD3FC">{</text>
    <text x="476" y="380" fill="#FCD34D">"result"</text>
    <text x="528" y="380" fill="#94A3B8">: [{ </text>
    <text x="476" y="396" fill="#94A3B8">  </text>
    <text x="488" y="396" fill="#FCD34D">"from_name"</text>
    <text x="560" y="396" fill="#94A3B8">: </text>
    <text x="572" y="396" fill="#FCA5A5">"label"</text>
    <text x="612" y="396" fill="#94A3B8">,</text>
    <text x="488" y="412" fill="#FCD34D">"to_name"</text>
    <text x="546" y="412" fill="#94A3B8">: </text>
    <text x="558" y="412" fill="#FCA5A5">"img"</text>
    <text x="588" y="412" fill="#94A3B8">,</text>
    <text x="488" y="428" fill="#FCD34D">"type"</text>
    <text x="528" y="428" fill="#94A3B8">: </text>
    <text x="540" y="428" fill="#FCA5A5">"rectanglelabels"</text>
    <text x="640" y="428" fill="#94A3B8">,</text>
    <text x="488" y="444" fill="#FCD34D">"value"</text>
    <text x="534" y="444" fill="#94A3B8">: {...} }],</text>
    <text x="476" y="460" fill="#FCD34D">"score"</text>
    <text x="522" y="460" fill="#94A3B8">: </text>
    <text x="534" y="460" fill="#A7F3D0">0.92</text>
    <text x="568" y="460" fill="#94A3B8">,</text>
    <text x="476" y="476" fill="#FCD34D">"model_version"</text>
    <text x="572" y="476" fill="#94A3B8">: </text>
    <text x="584" y="476" fill="#FCA5A5">"agent-v1.2"</text>
    <text x="660" y="476" fill="#94A3B8">,</text>
    <text x="476" y="492" fill="#FCD34D">"trace"</text>
    <text x="522" y="492" fill="#94A3B8">: [...]   // Agent 多步思考痕迹</text>
    <text x="464" y="508" fill="#7DD3FC">}</text>
  </g>
  <text x="464" y="528" fill="#94A3B8" font-size="10">result 与人工标注同结构 · trace 仅 Agent 有 · pipeline 自动归档审计</text>
</svg>
