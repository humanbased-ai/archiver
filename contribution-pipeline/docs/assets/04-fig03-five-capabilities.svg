<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" style="max-width:880px;height:auto;background:transparent" font-family='-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif'>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <text x="440" y="26" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">五大核心能力</text>

  <!-- 5 capability cards -->
  <g>
    <rect x="50"  y="60" width="140" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="78" cy="84" r="13" fill="#E0F2FE" stroke="#BAE6FD"/>
    <text x="78" y="89" text-anchor="middle" fill="#0284C7" font-size="12" font-weight="700">1</text>
    <text x="120" y="89" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="600">数据采集</text>
    <text x="120" y="118" text-anchor="middle" fill="#64748B" font-size="10.5">上传 / 云盘 / API</text>

    <rect x="210" y="60" width="140" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="238" cy="84" r="13" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="238" y="89" text-anchor="middle" fill="#059669" font-size="12" font-weight="700">2</text>
    <text x="282" y="89" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="600">AI 预标注</text>
    <text x="280" y="118" text-anchor="middle" fill="#64748B" font-size="10.5">省 50-80% 人力</text>

    <rect x="370" y="60" width="140" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="398" cy="84" r="13" fill="#FEF3C7" stroke="#FCD34D"/>
    <text x="398" y="89" text-anchor="middle" fill="#B45309" font-size="12" font-weight="700">3</text>
    <text x="442" y="89" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="600">人工标注</text>
    <text x="440" y="118" text-anchor="middle" fill="#64748B" font-size="10.5">画布 + 表单</text>

    <rect x="530" y="60" width="140" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="558" cy="84" r="13" fill="#FFE4E6" stroke="#FDA4AF"/>
    <text x="558" y="89" text-anchor="middle" fill="#BE123C" font-size="12" font-weight="700">4</text>
    <text x="602" y="89" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="600">审核质检</text>
    <text x="600" y="118" text-anchor="middle" fill="#64748B" font-size="10.5">自动 + 抽检 + 人审</text>

    <rect x="690" y="60" width="140" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="718" cy="84" r="13" fill="#E0E7FF" stroke="#C7D2FE"/>
    <text x="718" y="89" text-anchor="middle" fill="#4338CA" font-size="12" font-weight="700">5</text>
    <text x="762" y="89" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="600">数据导出</text>
    <text x="760" y="118" text-anchor="middle" fill="#64748B" font-size="10.5">JSONL / COCO / YOLO</text>
  </g>

  <!-- arrows between -->
  <g stroke="#94A3B8" stroke-width="1.5" fill="none">
    <line x1="190" y1="100" x2="210" y2="100" marker-end="url(#arr3)"/>
    <line x1="350" y1="100" x2="370" y2="100" marker-end="url(#arr3)"/>
    <line x1="510" y1="100" x2="530" y2="100" marker-end="url(#arr3)"/>
    <line x1="670" y1="100" x2="690" y2="100" marker-end="url(#arr3)"/>
  </g>

  <!-- orchestration banner -->
  <rect x="50" y="160" width="780" height="56" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="80" cy="188" r="13" fill="#6366F1"/>
  <text x="80" y="193" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">★</text>
  <text x="110" y="184" fill="#3730A3" font-size="13" font-weight="600">任务编排 · 贯穿全流程</text>
  <text x="110" y="204" fill="#6366F1" font-size="11">把上面 4 步串成一条可配置的流水线 · 而不是在多个工具之间倒腾</text>
</svg>
