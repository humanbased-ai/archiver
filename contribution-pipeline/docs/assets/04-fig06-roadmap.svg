<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="100%" style="max-width:880px;height:auto;background:transparent" font-family='-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif'>
  <defs>
    <marker id="arr6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6366F1"/>
    </marker>
  </defs>

  <text x="440" y="26" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">推进节奏 · 路线图</text>

  <!-- timeline base line -->
  <line x1="40" y1="215" x2="830" y2="215" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="40" y1="215" x2="838" y2="215" stroke="#6366F1" stroke-width="2" marker-end="url(#arr6)" stroke-dasharray="3 4"/>

  <!-- dots on timeline (under each card center) -->
  <circle cx="100" cy="215" r="6" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="270" cy="215" r="6" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="440" cy="215" r="6" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="610" cy="215" r="6" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="780" cy="215" r="6" fill="#EC4899" stroke="#FFFFFF" stroke-width="2"/>

  <!-- card 1A: 业务验证 (cyan) -->
  <rect x="19" y="50" width="162" height="148" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="19" y="50" width="162" height="6" rx="3" fill="#0EA5E9"/>
  <rect x="33" y="68" width="72" height="22" rx="11" fill="#E0F2FE"/>
  <text x="69" y="84" text-anchor="middle" fill="#0284C7" font-size="11" font-weight="600">Phase 1A</text>
  <text x="33" y="118" fill="#0f172a" font-size="16" font-weight="700">业务验证</text>
  <text x="33" y="140" fill="#475569" font-size="11.5">出业务结果，证明价值</text>
  <text x="33" y="162" fill="#94A3B8" font-size="10.5">LS 闭环 + 自研表单闭环</text>
  <text x="33" y="180" fill="#94A3B8" font-size="10.5">两条 pipeline 跑通</text>

  <!-- card 1B: 配置化骨架 (teal) -->
  <rect x="189" y="50" width="162" height="148" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="189" y="50" width="162" height="6" rx="3" fill="#14B8A6"/>
  <rect x="203" y="68" width="72" height="22" rx="11" fill="#CCFBF1"/>
  <text x="239" y="84" text-anchor="middle" fill="#0F766E" font-size="11" font-weight="600">Phase 1B</text>
  <text x="203" y="118" fill="#0f172a" font-size="16" font-weight="700">配置化骨架</text>
  <text x="203" y="140" fill="#475569" font-size="11.5">反向抽象、元能力注册</text>
  <text x="203" y="162" fill="#94A3B8" font-size="10.5">YAML / 加载器</text>
  <text x="203" y="180" fill="#94A3B8" font-size="10.5">Open API 最小集</text>

  <!-- card 2: 自动化降本 (green) -->
  <rect x="359" y="50" width="162" height="148" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="359" y="50" width="162" height="6" rx="3" fill="#10B981"/>
  <rect x="373" y="68" width="64" height="22" rx="11" fill="#ECFDF5"/>
  <text x="405" y="84" text-anchor="middle" fill="#059669" font-size="11" font-weight="600">Phase 2</text>
  <text x="373" y="118" fill="#0f172a" font-size="16" font-weight="700">自动化降本</text>
  <text x="373" y="140" fill="#475569" font-size="11.5">模型 + 规则替代人工</text>
  <text x="373" y="162" fill="#94A3B8" font-size="10.5">自动审核 / 分流</text>
  <text x="373" y="180" fill="#94A3B8" font-size="10.5">多项目 / ML 即插即用</text>

  <!-- card 3: 质量与规模化 (amber) -->
  <rect x="529" y="50" width="162" height="148" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="529" y="50" width="162" height="6" rx="3" fill="#F59E0B"/>
  <rect x="543" y="68" width="64" height="22" rx="11" fill="#FEF3C7"/>
  <text x="575" y="84" text-anchor="middle" fill="#B45309" font-size="11" font-weight="600">Phase 3</text>
  <text x="543" y="118" fill="#0f172a" font-size="16" font-weight="700">质量与规模</text>
  <text x="543" y="140" fill="#475569" font-size="11.5">降本 + 可追溯</text>
  <text x="543" y="162" fill="#94A3B8" font-size="10.5">金标 / 抽检 / 一致性</text>
  <text x="543" y="180" fill="#94A3B8" font-size="10.5">数据血缘 / 质量分</text>

  <!-- card 4: 可视化编排 (pink) -->
  <rect x="699" y="50" width="162" height="148" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="699" y="50" width="162" height="6" rx="3" fill="#EC4899"/>
  <rect x="713" y="68" width="64" height="22" rx="11" fill="#FCE7F3"/>
  <text x="745" y="84" text-anchor="middle" fill="#BE185D" font-size="11" font-weight="600">Phase 4</text>
  <text x="713" y="118" fill="#0f172a" font-size="16" font-weight="700">可视化编排</text>
  <text x="713" y="140" fill="#475569" font-size="11.5">运营自助拖拽</text>
  <text x="713" y="162" fill="#94A3B8" font-size="10.5">画布编辑器 / 模板市场</text>
  <text x="713" y="180" fill="#94A3B8" font-size="10.5">YAML ↔ 图双向编译</text>

  <text x="836" y="234" text-anchor="end" fill="#94A3B8" font-size="10">演进顺序</text>
</svg>
