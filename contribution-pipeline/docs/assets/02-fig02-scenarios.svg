<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" style="max-width:880px;height:auto;background:transparent" font-family='-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif'>
  <text x="440" y="24" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">Label Studio · 覆盖场景</text>

  <!-- center hub -->
  <rect x="370" y="48" width="140" height="42" rx="21" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="440" y="74" text-anchor="middle" fill="#3730A3" font-size="13" font-weight="700">Label Studio</text>

  <!-- connector lines from hub to columns -->
  <g stroke="#CBD5E1" stroke-width="1.2" fill="none">
    <path d="M 440 90 C 440 110, 90 110, 90 130"/>
    <path d="M 440 90 C 440 110, 265 110, 265 130"/>
    <line x1="440" y1="90" x2="440" y2="130"/>
    <path d="M 440 90 C 440 110, 615 110, 615 130"/>
    <path d="M 440 90 C 440 110, 790 110, 790 130"/>
  </g>

  <!-- Column 1: 图片 (sky) -->
  <rect x="20" y="130" width="140" height="32" rx="10" fill="#E0F2FE" stroke="#BAE6FD"/>
  <text x="90" y="151" text-anchor="middle" fill="#075985" font-size="13" font-weight="700">图片</text>
  <g font-size="11.5" fill="#334155">
    <text x="90" y="186" text-anchor="middle">分类</text>
    <text x="90" y="210" text-anchor="middle">检测 / 画框</text>
    <text x="90" y="234" text-anchor="middle">分割 / 多边形</text>
    <text x="90" y="258" text-anchor="middle">OCR 区域</text>
  </g>

  <!-- Column 2: 文本 (emerald) -->
  <rect x="195" y="130" width="140" height="32" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="265" y="151" text-anchor="middle" fill="#065F46" font-size="13" font-weight="700">文本</text>
  <g font-size="11.5" fill="#334155">
    <text x="265" y="186" text-anchor="middle">分类</text>
    <text x="265" y="210" text-anchor="middle">NER · 实体识别</text>
    <text x="265" y="234" text-anchor="middle">关系抽取</text>
  </g>

  <!-- Column 3: 音频 (amber) -->
  <rect x="370" y="130" width="140" height="32" rx="10" fill="#FEF3C7" stroke="#FCD34D"/>
  <text x="440" y="151" text-anchor="middle" fill="#92400E" font-size="13" font-weight="700">音频</text>
  <g font-size="11.5" fill="#334155">
    <text x="440" y="186" text-anchor="middle">语音转写</text>
    <text x="440" y="210" text-anchor="middle">事件标注</text>
  </g>

  <!-- Column 4: 视频 (rose) -->
  <rect x="545" y="130" width="140" height="32" rx="10" fill="#FFE4E6" stroke="#FDA4AF"/>
  <text x="615" y="151" text-anchor="middle" fill="#9F1239" font-size="13" font-weight="700">视频</text>
  <g font-size="11.5" fill="#334155">
    <text x="615" y="186" text-anchor="middle">分类</text>
    <text x="615" y="210" text-anchor="middle">时间片段</text>
  </g>

  <!-- Column 5: LLM (indigo) -->
  <rect x="720" y="130" width="140" height="32" rx="10" fill="#E0E7FF" stroke="#C7D2FE"/>
  <text x="790" y="151" text-anchor="middle" fill="#3730A3" font-size="13" font-weight="700">LLM</text>
  <g font-size="11.5" fill="#334155">
    <text x="790" y="186" text-anchor="middle">打分</text>
    <text x="790" y="210" text-anchor="middle">偏好选择</text>
    <text x="790" y="234" text-anchor="middle">RAG 评估</text>
  </g>

  <text x="440" y="298" text-anchor="middle" fill="#94A3B8" font-size="11">通过 XML 配置组合不同标注组件 · 一套系统覆盖多模态</text>
</svg>
