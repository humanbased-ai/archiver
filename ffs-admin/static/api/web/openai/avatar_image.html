<script type="text/javascript">

    var pre_path = '/ifsci'
    var dataUrl = pre_path+"/api/ai/gen/avatar";
    var findUrl = pre_path+"/api/ai/gen/records";

    var pageUrl = window.location.search;
    var pageParams = new URLSearchParams(pageUrl.split('?')[1]);
    var token = window.localStorage.token?window.localStorage.token:"";
    if(token == '' || token == null){
        token = pageParams.get('token')
    }
    token = token == null?'':token

    userId = pageParams.get('userId')
    username = pageParams.get('username')
    page_row_data_map = {}
    selectDataMap = {}
    current_page_no = 1
    current_page_size = 15
    post_status_map = {1: '成功', 0 :'失败'}
    $(document).ready(function() {
        query();
    });


    function genImage(obj, model){
        var image_count = jQuery('#image_count').val();
        var content =  jQuery('#content').val();
        var param = {
            "content": content,
            "image_count": image_count,
            "model": model
        };
        var url = dataUrl;
        $.ajax({
            type: "POST",
            url: url,
            data: JSON.stringify(param),
            headers: {'Content-Type': 'application/json'},
            dataType: "json",
            success: function(respone){
                console.log(respone);
                var retData = respone.data;
                loadImageHtml(retData);

                setTimeout(query, 10000)

            },
            error: function(data){ console.log(data);} ,
        });

    }

    function loadImageHtml(retData){
        if(retData!=null && retData.image_urls != null){
            var image_urls = retData.image_urls;
            var html = "";
            for(var i=0;i<image_urls.length;i++){
                var data = image_urls[i];
                html+=createImageRowHtml(data,i);
            }
            jQuery("#images_id").html(html)
        }
    }

    function createImageRowHtml(data,i){
        var html = '';

        html += '<img src="'+data+'" class="image_item">'
        return html;
    }



</script>
