services:
  label-studio:
    image: heartexlabs/label-studio:latest
    restart: unless-stopped
    ports:
      - "${LS_PORT:-8080}:8080"
    volumes:
      - ls-data:/label-studio/data
      - ./data:/data/local
    environment:
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /data/local

  ml-backend:
    build: ../ml-backend
    restart: unless-stopped
    ports:
      - "${ML_PORT:-9090}:9090"
    environment:
      LABEL_STUDIO_URL: http://label-studio:8080
      LABEL_STUDIO_API_KEY: ${LABEL_STUDIO_API_KEY:-}
      MODEL_PATH: ${MODEL_PATH:-yolov8n.pt}
      CONF_THRESHOLD: ${CONF_THRESHOLD:-0.25}
      IOU_THRESHOLD: ${IOU_THRESHOLD:-0.45}
    volumes:
      - ./models:/app/models
    depends_on:
      - label-studio

volumes:
  ls-data:
